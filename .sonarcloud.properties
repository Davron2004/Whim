# SonarCloud automatic-analysis scope. Mirrors the intent of .eslintignore so that a green
# local lint and a green cloud analysis mean the same thing.
#
# Sources and tests share the repo root (sonar.tests takes directories, not globs); the
# inclusion/exclusion patterns below partition them. A file is either product source, test
# code, or not code Sonar should grade.

sonar.sources=.
sonar.tests=.

# Test code: every acceptance suite, the live invariant runners, and the harness self-tests.
sonar.test.inclusions=**/test/**,invariants/**
# ...except the archived spike evidence and the vendored Playwright under it.
sonar.test.exclusions=invariants/**/reference/**,invariants/**/node_modules/**

# Not code Sonar should grade:
#   invariants/**/reference/**   archived spike-2 evidence (see its README), kept verbatim
#   fixtures/adversarial/**      intentionally hostile mini-app bundles the sandbox must contain
#   src/runtime/generated/**     emitted by `npm run build`
#   build/generated/**           emitted by `npm run build`
#   docs/design/reference/**     Claude Design canvas mockups, not product markup
#   graphify-out/**, demo/**     local tooling output and demo scaffolding
# The test patterns are repeated here so test files are not also counted as sources.
sonar.exclusions=**/test/**,invariants/**,fixtures/adversarial/**,src/runtime/generated/**,build/generated/**,docs/design/reference/**,graphify-out/**,demo/**,**/node_modules/**

# Sample mini-apps are similar to each other by design; do not count them as duplication.
sonar.cpd.exclusions=fixtures/**
