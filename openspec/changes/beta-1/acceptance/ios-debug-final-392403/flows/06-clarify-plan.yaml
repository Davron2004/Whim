appId: com.anycognition.whim
---
# Prerequisite: canned Clarify. Selects all three questions so the last plan row is known.
- tapOn: "Just today"
- tapOn: "Type it"
- scrollUntilVisible:
    element: "It stays, ticked"
    direction: DOWN
    timeout: 10000
- tapOn: "It stays, ticked"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Build it"
    timeout: 30000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-plan-before-build"
