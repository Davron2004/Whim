appId: com.anycognition.whim
---
# Prerequisite: empty Compose; PROMPT is ordinary keyboard-test text (no regex metacharacters).
- tapOn: "Describe an app…"
- waitForAnimationToEnd
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-compose-first-focus"
- inputText: "${PROMPT}"
- assertVisible: "Continue"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-compose-typed-before-done"
- tapOn: "Done"
- waitForAnimationToEnd
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-compose-done"
- tapOn: "${PROMPT}"
- waitForAnimationToEnd
- assertVisible: "Done"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-compose-refocus"
