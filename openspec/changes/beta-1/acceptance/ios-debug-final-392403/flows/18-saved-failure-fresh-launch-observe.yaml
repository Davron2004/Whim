appId: com.anycognition.whim
---
# OBSERVATION ONLY. Prerequisite: existing saved ordinary failed ghost; no storage fault injected.
# A missing/unreadable journal cannot be forced with this flow. EXPECTED_REASON is observed copy.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Describe an app…"
    timeout: 15000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-saved-failure-fresh-home"
- tapOn: "${GHOST_TITLE}"
- assertVisible: "${EXPECTED_REASON}"
- assertVisible: "Try again"
- assertVisible: "Back to your apps"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-saved-failure-fresh-reopen"
