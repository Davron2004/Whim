appId: com.anycognition.whim
---
# Prerequisite: 08 started [[future:fail]], untouched marker-bearing plan.
- extendedWaitUntil:
    visible: "This build needs a newer version of Whim to finish."
    timeout: 120000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-before-action"
- tapOn: "Back to your apps"
- assertVisible: "Didn’t finish"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-home-before-reopen"
- longPressOn: "${GHOST_TITLE}"
- assertVisible: "Dismiss"
- assertNotVisible: "Open"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-ghost-actions-no-open"
- tapOn: "Cancel"
- tapOn: "${GHOST_TITLE}"
- assertVisible: "This build needs a newer version of Whim to finish."
- assertVisible: "Try again"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-reopened-before-retry"
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "Making it"
    timeout: 10000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-retry-destination"
- extendedWaitUntil:
    visible: "This build needs a newer version of Whim to finish."
    timeout: 120000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-future-fail-retry-terminal"
