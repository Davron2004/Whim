appId: com.anycognition.whim
---
# Prerequisite: 08 started [[future:update]], untouched marker-bearing plan.
- extendedWaitUntil:
    visible: "Update Whim to see this build through."
    timeout: 120000
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-update-before-back"
- tapOn: "Not now"
- assertVisible: "Update needed"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-update-home-before-reopen"
- longPressOn: "${GHOST_TITLE}"
- assertVisible: "Dismiss"
- assertNotVisible: "Open"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-update-ghost-actions-no-open"
- tapOn: "Cancel"
- tapOn: "${GHOST_TITLE}"
- assertVisible: "Update Whim to see this build through."
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-update-ghost-reopened"
