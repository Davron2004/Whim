appId: com.anycognition.whim
---
# Prerequisite: new Release candidate on production, legal flow complete, at Home.
- assertVisible: "Describe an app…"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-release-home"
- tapOn: "Describe an app…"
- assertVisible: "What should it do?"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-release-compose-before-focus"
- tapOn: "Describe an app…"
- inputText: "${PROMPT}"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-release-compose-before-done"
- tapOn: "Done"
- tapOn: "${PROMPT}"
- takeScreenshot: "${EVIDENCE_DIR}/${CASE}-release-compose-refocus"
