# Whim on the VM (design D17, D21, D24). deploy/deploy.sh uploads this file to /opt/whim and writes
# /opt/whim/.env next to it, which supplies every interpolated value below. Each one is written
# ${NAME:?}, so a compose command run without that file fails instead of recreating a container
# with blank settings. Logging stays json-file: the Ops Agent on the host (deploy/vm/ops-agent.yaml)
# tails those files, and the `labels` option puts the compose service name into each record for it.
name: whim

services:
  whim-server:
    image: ${WHIM_IMAGE:?}
    env_file:
      - /etc/whim/config.env
      - /etc/whim/server.env
    environment:
      WHIM_DATA_DIR: /data
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: ${WHIM_SERVER_SHM_SIZE:?}
    mem_limit: ${WHIM_SERVER_MEM_LIMIT:?}
    pids_limit: 1024
    cap_drop:
      - ALL
    # Docker's seccomp profile allows chroot only with CAP_SYS_CHROOT, and Chromium's namespace
    # sandbox chroots inside its own user namespace. The non-root process holds no effective capability.
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/whim/seccomp/chromium-playwright-1.60.0.json
    volumes:
      - /mnt/disks/whim-data/server:/data
    networks:
      - whim
    restart: unless-stopped
    # At least the drain timeout (WHIM_DRAIN_TIMEOUT_MS, default 630 s) plus 30 s, so Docker never
    # kills the server mid-drain.
    stop_grace_period: 11m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
        labels: com.docker.compose.service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  caddy:
    image: caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    environment:
      WHIM_API_HOST: ${WHIM_API_HOST:?}
      WHIM_WEB_HOST: ${WHIM_WEB_HOST:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/whim/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/disks/whim-data/caddy:/data
      - /mnt/disks/whim-data/site:/srv/site:ro
    networks:
      - whim
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
        labels: com.docker.compose.service

networks:
  whim:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24
