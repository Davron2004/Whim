# Unfilmed prep: delete ONE non-EXAMPLE tile named by env TILE (index IDX). Run repeatedly.
# Delete acts at once and offers Undo on a "<name> deleted" toast; the delete settles when the
# toast ends (10 s), so the next run starts from a grid without it.
appId: com.anycognition.whim
---
- longPressOn:
    text: ${TILE}
    index: ${IDX}
- waitForAnimationToEnd
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "${TILE} deleted"
    timeout: 8000
- extendedWaitUntil:
    notVisible: "${TILE} deleted"
    timeout: 15000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 1500, optional: true }
