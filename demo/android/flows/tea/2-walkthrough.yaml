# ─────────────────────────────────────────────────────────────────────────────
# LinkedIn cut, shot 2 — the app, v1: open it from the grid, walk into Adjust Time, drag the steep
# time, Done, Start Timer, hold on the live countdown. Film it with:
#
#   node ~/Work/other/filmkit/film-android.mjs demo/android/flows/tea/2-walkthrough.yaml \
#        --device emulator-5554 --out demo/raw/2026-09-11/shot-2 --name take-1 \
#        --size 1080x2404 --bit-rate 20000000 --guard-app com.whim --tighten
#
# PRECONDITION: Whim foregrounded ON the grid with the "Tea Steeper" tile (the instance shot 1
# built, grid slot 4). The app must be on Green, steep time 180 (3:00, "Preset" badge), timer Idle.
# The app reopens on Green with Green's saved time, so the setting changed here is Green's — that
# is what shot 3 shows surviving a cold start.
#
# WRITTEN FOR THE INSTANCE GENERATED 2026-09-11 ("Tea Steeper"), on the stock 1344x2992 @480dpi
# Pixel 9 Pro XL frame. This build is three screens, not one: a card ("Saved steep time" + Start
# Timer / Adjust Time / Open Timer), an "Adjust Steep Time" screen (preset chips, a seconds number
# field, and the slider), and a "Steep Timer" screen (countdown + progress bar + Cancel Timer).
# Slider geometry, measured on the Adjust screen: track x 124→1222 px at y 1306 px, ~0.82 s/px,
# step 5 s. The thumb for 180 s sits at x≈310 px = 23% of width; y 1306 px = 44% of height. A
# swipe must START ON THE THUMB (the SDK Slider is pointer-driven); a tap anywhere on the track
# also sets the value, which is how the off-camera reset to exactly 180 was done.
# 23%→48% lands on 445 s (7:25), measured. The a11y tree is populated on open without a wake tap
# on this instance (verified warm AND cold), so there is no wake tap and no stray ring.
appId: com.whim
---
- extendedWaitUntil:
    visible: "YOUR APPS"
    timeout: 20000

# Beat 1 — hold on the grid with the new tile, then open it.
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 2200, optional: true }
- tapOn: "Tea Steeper"
- extendedWaitUntil:
    visible: "Saved steep time"
    timeout: 45000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 2600, optional: true }

# Beat 2 — into Adjust Time.
- tapOn: "Adjust Time"
- extendedWaitUntil:
    visible: "Adjust Steep Time"
    timeout: 20000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 1800, optional: true }

# Beat 3 — tweak the steep time: drag the thumb right, 180 → ~445. The big readout, the seconds
# field and the slider's own label all follow live.
- swipe:
    start: "23%,44%"
    end: "48%,44%"
    duration: 1100
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 2400, optional: true }

# Beat 4 — Done: back on the card, now showing the new saved steep time.
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Saved steep time"
    timeout: 20000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 2200, optional: true }

# Beat 5 — Start Timer, and hold on the running countdown and the progress bar. The flow ENDS
# mid-steep on purpose: shot 3 kills the process from here.
- tapOn: "Start Timer"
- extendedWaitUntil:
    visible: "Steeping"
    timeout: 20000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 9000, optional: true }
