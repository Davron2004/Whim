# ─────────────────────────────────────────────────────────────────────────────
# LinkedIn cut, shot 3 — kill + reopen: the setting the user just changed survives a cold start.
# Film it with (NO --guard-app: this flow kills the app, and the guard would trip on the launcher's
# home screen between stopApp and launchApp):
#
#   node ~/Work/other/filmkit/film-android.mjs demo/android/flows/tea/3-persistence-reopen.yaml \
#        --device emulator-5554 --out demo/raw/2026-09-11/shot-3 --name take-1 \
#        --size 1080x2404 --bit-rate 20000000 --tighten
#
# PRECONDITION: Whim foregrounded INSIDE the tea timer on the "Steep Timer" screen, mid-countdown
# (film straight after shot 2). The one flow in the set that must `launchApp`, so its long waits
# are unreliable (filmkit FEEDBACK #4) — the re-entry wait is doubled, as in ../6-persistence-reopen.yaml.
# `stopApp` shows the real Android home for ~1s; that cut is hidden in the edit.
#
# WRITTEN FOR THE INSTANCE GENERATED 2026-09-11 ("Tea Steeper"). Shot 2 left the saved steep time
# at 440 s, which the card renders as "7:20" under "Saved steep time" — that is SETTING_RE. The
# launcher always cold-starts on the grid (the mini-app route is not restored), and the mini-app
# itself reopens on its card screen, so one tile tap is enough to land on the readout. The a11y
# tree is populated on a cold open without a wake tap on this instance (measured), so there is no
# wake tap and no stray tap ring in dead space.
appId: com.whim
env:
  TILE_RE: "Tea Steeper"
  SETTING_RE: ".*7:20.*"
---
- extendedWaitUntil:
    visible: "Steeping"
    timeout: 20000

# Beat 1 — hold on the live countdown.
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 3000, optional: true }

# Beat 2 — kill the process outright.
- stopApp
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 1800, optional: true }

# Beat 3 — cold start, back to the grid.
- launchApp
- extendedWaitUntil:
    visible: "YOUR APPS"
    timeout: 30000
- waitForAnimationToEnd
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 2400, optional: true }

# Beat 4 — back in: the setting is still there.
- tapOn: ${TILE_RE}
- extendedWaitUntil:
    visible: "Saved steep time"
    timeout: 60000
- extendedWaitUntil:
    visible: ${SETTING_RE}
    timeout: 20000
- extendedWaitUntil: { visible: "__whim_pause__", timeout: 4000, optional: true }
