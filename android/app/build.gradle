apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Whim's native release file (design D1): identity, version and domain. Same grammar as
 * scripts/release/lib/native-config.ts: "KEY = VALUE" lines, "//" comments and blank lines only,
 * no #include, no $(...), all five keys exactly once. The TypeScript parser also checks each
 * value's shape and runs in the gate, so a file this parser accepts but reads differently fails
 * there first.
 */
def parseWhimReleaseConfig(File configFile) {
    // Script methods can't see script-level `def` variables, so the key list lives in here.
    def whimReleaseConfigKeys = [
        'WHIM_APP_ID', 'WHIM_APPLE_TEAM_ID', 'WHIM_MARKETING_VERSION', 'WHIM_BUILD_NUMBER', 'WHIM_DOMAIN',
    ]
    def values = [:]
    def lineNumber = 0
    configFile.eachLine { line ->
        lineNumber++
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('//')) return
        def eq = trimmed.indexOf('=')
        if (eq == -1) {
            throw new GradleException("${configFile}:${lineNumber}: not a \"KEY = VALUE\" line, \"//\" comment, or blank line")
        }
        def key = trimmed.substring(0, eq).trim()
        def value = trimmed.substring(eq + 1).trim()
        if (!whimReleaseConfigKeys.contains(key)) {
            throw new GradleException("${configFile}:${lineNumber}: unknown key \"${key}\"")
        }
        if (value.contains('$(')) {
            throw new GradleException("${configFile}:${lineNumber}: \"${key}\" may not reference \"\$(...)\"")
        }
        if (values.containsKey(key)) {
            throw new GradleException("${configFile}:${lineNumber}: duplicate key \"${key}\" (already set earlier in the file)")
        }
        values[key] = value
    }
    def missing = whimReleaseConfigKeys.findAll { !values.containsKey(it) }
    if (!missing.isEmpty()) {
        throw new GradleException("${configFile}: missing required key(s): ${missing.join(', ')}")
    }
    return values
}

def whimReleaseConfig = parseWhimReleaseConfig(file('../../release/whim-release.xcconfig'))

/**
 * The store build's upload-signing values (design D4): a Gradle property, else an environment
 * variable of the same name. A blank value counts as missing. `preReleaseBuild`'s `doFirst` below
 * refuses to build `release` when any is missing; `debug` and `offline` never use them.
 */
def whimUploadPropertyNames = [
    'WHIM_UPLOAD_STORE_FILE', 'WHIM_UPLOAD_STORE_PASSWORD', 'WHIM_UPLOAD_KEY_ALIAS', 'WHIM_UPLOAD_KEY_PASSWORD',
]

def whimUploadProperty(String name) {
    def value = project.hasProperty(name) ? project.property(name)?.toString() : System.getenv(name)
    return value?.trim() ? value : null
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.whim"
    def whimVersionCode = (project.hasProperty('whimBuildNumber') ? project.property('whimBuildNumber') : whimReleaseConfig.WHIM_BUILD_NUMBER).toString().toInteger()
    defaultConfig {
        applicationId whimReleaseConfig.WHIM_APP_ID
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName whimReleaseConfig.WHIM_MARKETING_VERSION
        versionCode whimVersionCode
        // A single-key assignment, never a map replacement (design D1).
        manifestPlaceholders.whimWebHost = "whim.${whimReleaseConfig.WHIM_DOMAIN}"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def storeFilePath = whimUploadProperty('WHIM_UPLOAD_STORE_FILE')
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
            }
            storePassword whimUploadProperty('WHIM_UPLOAD_STORE_PASSWORD')
            keyAlias whimUploadProperty('WHIM_UPLOAD_KEY_ALIAS')
            keyPassword whimUploadProperty('WHIM_UPLOAD_KEY_PASSWORD')
        }
    }
    // Three build types (design D4), all under the one application id:
    //   • debug   — debug-signed, debuggable, JS from Metro, dev cleartext hosts (src/debug/res).
    //   • offline — the dev loop without Metro: release's configuration with the JS bundle baked
    //     in, but debug-signed, debuggable, and with the dev cleartext hosts. `npm run
    //     android:release` builds it, because the emulator's NAT route to Metro is dead and the
    //     LAN generation server speaks http. Never uploaded.
    //   • release — the store build: upload-signed from the four WHIM_UPLOAD_* values, never the
    //     debug key, not debuggable, no cleartext exception, shipped as an AAB.
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        offline {
            initWith release
            signingConfig signingConfigs.debug
            debuggable true
            matchingFallbacks = ['release']
            // The RN plugin sets this placeholder in `finalizeDsl`, on build types it knows by name
            // only, after `initWith release` has already copied release's placeholders. The value
            // is inert (the network security config wins on API 24+) and matches old `release`.
            manifestPlaceholders.usesCleartextTraffic = "false"
            // AGP picks the CMake build type from the variant name ("*release" → RelWithDebInfo,
            // "*debug" → Debug) and falls back to `debuggable` for any other name, so `offline`
            // would compile C++ as Debug: no NDEBUG, so REACT_NATIVE_DEBUG, so codegen'd
            // component code references debug-only symbols (ShadowNode::getDebugName, ...) that
            // the release react-android AAR picked by `matchingFallbacks` doesn't export. Pinning
            // the type keeps the old `release` build's native flags (RN's own `debugOptimized`
            // build type pairs its release fallback with a pinned CMake type the same way).
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
    }
    sourceSets {
        offline {
            res.srcDirs += 'src/debug/res'
        }
    }
}

// Fails any `release` build on a machine without the upload key, naming each missing value.
// `tasks.named` can't be used: AGP registers `preReleaseBuild` after this script runs.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def missing = whimUploadPropertyNames.findAll { whimUploadProperty(it) == null }
        if (!missing.isEmpty()) {
            throw new GradleException("Android release build is missing: ${missing.join(', ')}. See docs/release/mobile.md.")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
