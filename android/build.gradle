buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 9's default NDK (28.2) differs from RN 0.88.1's pinned 27.1, and a
// library without its own ndkVersion would get the default: two STL versions
// in one APK (op-sqlite 16 did; 19 reads rootProject.ext.ndkVersion). Force
// every library onto the app's NDK.
subprojects {
    plugins.withId("com.android.library") {
        androidComponents {
            finalizeDsl { ext -> ext.ndkVersion = rootProject.ext.ndkVersion }
        }
    }
}
