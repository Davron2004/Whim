<title>Whim System v1</title>
<!-- Whim system v1 review page. One self-contained file: all CSS and JS below are readable source, edit in place. Lucide icons (ISC licence) are inlined as path data. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Page chrome for the Whim system v1 review. Layout: a sticky bar, then one view at a time
   (overview, screen, components, tokens, motion), frames laid out in wrapping rows. */
:root {
  --pg-bg: #E9E6E1; --pg-surface: #F6F4F1; --pg-raised: #FFFFFF; --pg-text: #1A1614; --pg-text2: #625B55;
  --pg-line: #D6D1CA; --pg-accent: #B14200; --pg-chip: #DEDAD4; --pg-chip-on: #1A1614; --pg-chip-on-text: #FFFFFF;
  --pg-font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #0C0B0A; --pg-surface: #171513; --pg-raised: #1F1C1A; --pg-text: #F2F0EC; --pg-text2: #AAA49D;
    --pg-line: #2C2926; --pg-accent: #F99549; --pg-chip: #2A2724; --pg-chip-on: #F2F0EC; --pg-chip-on-text: #1A1614;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pg-bg: #0C0B0A; --pg-surface: #171513; --pg-raised: #1F1C1A; --pg-text: #F2F0EC; --pg-text2: #AAA49D;
  --pg-line: #2C2926; --pg-accent: #F99549; --pg-chip: #2A2724; --pg-chip-on: #F2F0EC; --pg-chip-on-text: #1A1614;
  color-scheme: dark;
}
html, body { background: var(--pg-bg); }
body { margin: 0; color: var(--pg-text); font-family: var(--pg-font); font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.pg-wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 0 80px; }

.pg-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; background: color-mix(in srgb, var(--pg-bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--pg-line); }
.pg-bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.pg-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; text-decoration: none; }
.pg-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.pg-nav a { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--pg-text2); }
.pg-nav a.on { background: var(--pg-chip-on); color: var(--pg-chip-on-text); }
.pg-nav a:focus-visible, .pg-seg button:focus-visible, .pg-btn:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.pg-tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.pg-seg { display: inline-flex; background: var(--pg-chip); border-radius: 999px; padding: 2px; }
.pg-seg button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; color: var(--pg-text2); cursor: pointer; }
.pg-seg button.on { background: var(--pg-raised); color: var(--pg-text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.pg-hero { padding: 56px 0 20px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.pg-hero h1 { font-size: 52px; line-height: 56px; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.pg-hero .lead { font-size: 19px; line-height: 29px; color: var(--pg-text2); margin: 18px 0 0; max-width: 60ch; }
.pg-moves { margin: 28px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
.pg-moves li { font-size: 15px; line-height: 22px; color: var(--pg-text2); padding-left: 0; }
.pg-moves b { color: var(--pg-text); font-weight: 600; display: block; }
.pg-hero-art { display: flex; gap: 16px; justify-content: center; }

.pg-section { margin-top: 56px; }
.pg-section > h2 { font-size: 30px; line-height: 36px; letter-spacing: -0.015em; margin: 0 0 6px; }
.pg-section > p.sub { margin: 0 0 22px; color: var(--pg-text2); max-width: 70ch; }
.pg-cards { display: flex; flex-wrap: wrap; gap: 28px 24px; }
.pg-card { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.pg-card h3 { margin: 0; font-size: 16px; line-height: 22px; }
.pg-card h3 a { text-decoration: none; }
.pg-card h3 a:hover { text-decoration: underline; }
.pg-card p { margin: 0; font-size: 14px; line-height: 20px; color: var(--pg-text2); max-width: var(--note-w, 420px); }
.pg-frames { display: flex; gap: 12px; }
.fw { position: relative; flex: none; border-radius: 34px; }
.fw > .phone { transform-origin: top left; position: absolute; left: 0; top: 0; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 10px 30px rgba(0, 0, 0, .14); }
:root[data-theme="dark"] .fw > .phone { box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 10px 30px rgba(0, 0, 0, .5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fw > .phone { box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 10px 30px rgba(0, 0, 0, .5); } }

.pg-focus-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin: 36px 0 20px; }
.pg-focus-head h2 { margin: 0; font-size: 34px; line-height: 40px; letter-spacing: -0.02em; }
.pg-focus-head p { margin: 6px 0 0; color: var(--pg-text2); max-width: 70ch; }
.pg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--pg-chip); color: var(--pg-text); text-decoration: none; font-size: 14px; font-weight: 600; border: 0; cursor: pointer; font-family: inherit; }
.pg-btn.dark { background: var(--pg-chip-on); color: var(--pg-chip-on-text); }
.pg-scroll { overflow-x: auto; padding-bottom: 12px; }
.pg-scroll .pg-frames { gap: 24px; }
.pg-flabel { font-size: 13px; color: var(--pg-text2); margin-bottom: 8px; font-weight: 600; }

.pg-story { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 22px 22px 18px; margin-top: 18px; }
.pg-story h3 { margin: 0; font-size: 18px; }
.pg-story > p { margin: 4px 0 16px; color: var(--pg-text2); font-size: 14px; }
.pg-storyrow { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
.pg-storyframe { flex: none; text-decoration: none; }
.pg-arrow { flex: none; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--pg-text2); }
.pg-arrow span { font-size: 22px; color: var(--pg-accent); }
.pg-arrow small { font-size: 11.5px; line-height: 15px; }

.pg-proto { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.pg-proto-stage { position: relative; flex: none; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 18px 50px rgba(0, 0, 0, .18); }
.pg-proto-layer { position: absolute; left: 0; top: 0; transform-origin: top left; }
.pg-proto-steps { margin: 0; padding-left: 20px; color: var(--pg-text2); font-size: 15px; line-height: 26px; max-width: 34ch; }
.pg-proto-steps b { color: var(--pg-text); }
.proto-hot { outline: 2px solid color-mix(in srgb, var(--pg-accent) 70%, transparent); outline-offset: 3px; animation: pg-hot 1.6s ease-in-out infinite; cursor: pointer; }
@keyframes pg-hot { 50% { outline-color: color-mix(in srgb, var(--pg-accent) 15%, transparent); } }
@media (prefers-reduced-motion: reduce) { .proto-hot { animation: none; } }

/* Tokens */
.pg-board { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 24px; }
.pg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.pg-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pg-sw { border-radius: 14px; overflow: hidden; border: 1px solid var(--pg-line); background: var(--pg-raised); }
.pg-sw .chipc { height: 52px; display: flex; }
.pg-sw .chipc span { flex: 1; }
.pg-sw .meta { padding: 8px 10px; font-size: 12px; line-height: 16px; }
.pg-sw .meta b { display: block; font-size: 13px; }
.pg-sw code, .pg-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--pg-text2); }
.pg-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pg-table td, .pg-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--pg-line); vertical-align: middle; }
.pg-table th { font-size: 12px; color: var(--pg-text2); font-weight: 600; }
.pg-tablewrap { overflow-x: auto; }
.pg-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.pg-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 8px; border-radius: 12px; font-size: 10.5px; color: var(--pg-text2); text-align: center; word-break: break-word; }
.pg-icon.glyph { background: var(--pg-raised); }
.pg-icon svg { color: var(--pg-text); }

/* Motion */
.pg-demo { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pg-demo h3 { margin: 0; font-size: 18px; }
.pg-demo p { margin: 0; color: var(--pg-text2); font-size: 14px; line-height: 20px; }
.pg-demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.pg-spring { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--pg-line); }
.pg-spring:last-child { border-bottom: 0; }
.pg-spring canvas { width: 100%; height: 64px; display: block; }
.pg-track { position: relative; height: 28px; border-radius: 14px; background: var(--pg-chip); cursor: pointer; }
.pg-track .ball { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 10px; background: var(--pg-accent); }
.pg-stage { position: relative; display: flex; justify-content: center; }
.pg-code { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--pg-raised); border: 1px solid var(--pg-line); font: 12px/18px ui-monospace, "SF Mono", Menlo, monospace; color: var(--pg-text); white-space: pre-wrap; overflow-wrap: anywhere; max-width: var(--note-w, 70ch); }
.pg-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pg-range { width: 100%; }

@media (max-width: 860px) {
  .pg-hero { grid-template-columns: minmax(0, 1fr); padding-top: 32px; }
  .pg-hero h1 { font-size: 38px; line-height: 42px; }
  .pg-moves { grid-template-columns: minmax(0, 1fr); }
  .pg-grid2 { grid-template-columns: minmax(0, 1fr); }
  .pg-tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* Whim system v1: components, scoped to .phone so every frame carries its own scheme.
   Every colour, shadow and tint value lives in src/tokens.js (TOKENS), which writes the custom properties
   these rules read. Values: docs/design/system.md §2. */

/* ── Frame ─────────────────────────────────────────────────────────────── */
.phone {
  position: relative; width: var(--pw, 390px); height: var(--ph, 844px); overflow: hidden;
  background: var(--w-bg); color: var(--w-text);
  border-radius: 54px; box-sizing: border-box;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
  font-size: 17px; line-height: 24px; text-rendering: optimizeLegibility;
}
.phone[data-platform="android"] { border-radius: 40px; }
:where(.phone) *, :where(.phone) *::before, :where(.phone) *::after { box-sizing: border-box; }
.phone[data-platform="ios"] { font-family: -apple-system, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif; }
.phone[data-platform="android"] { font-family: Roboto, "Roboto Flex", system-ui, Arial, sans-serif; }
:where(.phone) svg { display: block; }
:where(.phone) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.w-statusbar { position: absolute; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; color: var(--w-bar-text); pointer-events: none; }
.phone[data-platform="ios"] .w-statusbar { height: 54px; padding: 0 34px 0 48px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
.phone[data-platform="android"] .w-statusbar { height: 40px; padding: 0 24px; font-size: 14px; font-weight: 500; letter-spacing: 0.01em; }
.w-statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.w-statusbar.on-dark { color: #FFFFFF; }
.phone.on-dark .w-homebar { background: #FFFFFF; }
.w-island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: var(--w-island); border-radius: 20px; z-index: 31; }
.w-punch { position: absolute; top: 12px; left: 50%; width: 16px; height: 16px; margin-left: -8px; background: #000; border-radius: 50%; z-index: 31; }
.w-homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--w-text); opacity: .9; z-index: 40; }
.phone[data-platform="android"] .w-homebar { width: 108px; height: 4px; margin-left: -54px; bottom: 10px; opacity: .75; }

.w-screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--w-bg); }
.w-scroll { flex: 1; overflow: hidden; position: relative; }
.w-pad { padding-left: var(--w-gutter); padding-right: var(--w-gutter); }
.w-top-ios { height: 54px; flex: none; }
.w-top-android { height: 40px; flex: none; }

/* ── Type ──────────────────────────────────────────────────────────────── */
.t-display { font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-large { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.016em; text-wrap: balance; }
.t-title1 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.012em; text-wrap: balance; }
.t-title2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.008em; text-wrap: balance; }
.t-title3 { font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -0.004em; }
.t-headline { font-size: 17px; line-height: 22px; font-weight: 600; }
.t-body { font-size: 17px; line-height: 24px; font-weight: 400; }
.t-callout { font-size: 15px; line-height: 20px; font-weight: 400; letter-spacing: 0.004em; }
.t-footnote { font-size: 13px; line-height: 18px; font-weight: 400; letter-spacing: 0.008em; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.012em; }
.t-sec { color: var(--w-text2); }
.t-ter { color: var(--w-text3); }
.t-ember { color: var(--w-ember-text); }
.t-danger { color: var(--w-danger-text); }
.t-pos { color: var(--w-pos-text); }
.t-warn { color: var(--w-warn-text); }
.t-tint { color: var(--t-text); }
.t-semibold { font-weight: 600; }
.t-num { font-variant-numeric: tabular-nums; }
.t-quote { font-style: italic; }
.t-center { text-align: center; }

/* ── Header ────────────────────────────────────────────────────────────── */
.w-header { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; position: relative; z-index: 5; }
.w-header .w-inline-title { position: absolute; left: 60px; right: 60px; text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phone[data-platform="android"] .w-header .w-inline-title { text-align: left; left: 56px; font-size: 20px; font-weight: 500; }
.w-header .h-right { display: flex; align-items: center; gap: 0; }
.w-titleblock { padding: 4px var(--w-gutter) 0; }
.w-titleblock .w-sub { margin-top: 4px; }
.w-edgefade { position: absolute; left: 0; right: 0; height: 16px; pointer-events: none; z-index: 4; }
.w-edgefade.top { top: 0; background: linear-gradient(var(--w-bg), color-mix(in srgb, var(--w-bg) 0%, transparent)); }
.w-edgefade.bottom { bottom: 0; background: linear-gradient(color-mix(in srgb, var(--w-bg) 0%, transparent), var(--w-bg)); }

/* ── Buttons ───────────────────────────────────────────────────────────── */
.w-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; font-size: 17px; line-height: 22px; font-weight: 600; text-align: center; transition: transform 160ms cubic-bezier(.23, 1, .32, 1); user-select: none; }
.w-btn.md { min-height: 44px; padding: 0 18px; }
.w-btn.plain.md { padding: 0 12px; }
.w-btn.sm { min-height: 34px; padding: 0 14px; font-size: 15px; line-height: 20px; }
.w-btn.block { display: flex; width: 100%; }
.w-btn.ember { background: var(--w-ember); color: var(--w-on-ember); }
.w-btn.ink { background: var(--w-ink); color: var(--w-on-ink); }
.w-btn.tint { background: var(--t-fill); color: var(--t-on); }
.w-btn.secondary { background: var(--w-fill); color: var(--w-text); }
.w-btn.plain { background: transparent; color: var(--w-text); }
.w-btn.danger { background: var(--w-danger-soft); color: var(--w-danger-text); }
.w-btn.plain-ember { background: transparent; color: var(--w-ember-text); }
.w-btn.disabled { background: var(--w-fill); color: var(--w-text3); }
.w-btn svg { flex: none; }
.w-iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--w-text); }
.w-iconbtn.filled > span { width: 36px; height: 36px; border-radius: 18px; background: var(--w-fill); display: inline-flex; align-items: center; justify-content: center; }
.w-textbtn { height: 44px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 17px; font-weight: 600; color: var(--w-text); }
.w-textbtn.danger { color: var(--w-danger-text); }
.w-actions { flex: none; padding: 16px var(--w-gutter) 0; display: flex; flex-direction: column; gap: 4px; }
.w-actions .w-btn.plain, .w-actions .w-btn.plain-ember { min-height: 44px; }
.w-actions { position: relative; }
.w-actions.fade::before { content: ""; position: absolute; left: 0; right: 0; top: -16px; height: 16px; background: linear-gradient(color-mix(in srgb, var(--w-sheet) 0%, transparent), var(--w-sheet)); pointer-events: none; }

/* ── Grouped list ──────────────────────────────────────────────────────── */
.w-list { background: var(--w-surface); border-radius: 20px; overflow: hidden; }
.w-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; position: relative; }
.w-row + .w-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--w-sep); }
.w-list.icons .w-row + .w-row::before { left: 52px; }
.w-row .r-icon { color: var(--w-text2); flex: none; width: 20px; }
.w-row .r-main { flex: 1; min-width: 0; }
.w-row .r-title { font-size: 17px; line-height: 22px; }
.w-row .r-sub { font-size: 13px; line-height: 18px; color: var(--w-text2); margin-top: 2px; }
.w-row .r-trail { flex: none; display: flex; align-items: center; gap: 6px; color: var(--w-text2); font-size: 15px; line-height: 20px; }
.w-row .r-chev { color: var(--w-text2); }
.w-row.danger .r-title { color: var(--w-danger-text); }
.w-row.pressed { background: var(--w-fill); }
.w-sec-h { padding: 0 var(--w-gutter); margin: 24px 0 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--w-text2); letter-spacing: 0.008em; }
.w-sec-f { padding: 8px var(--w-gutter) 0; font-size: 13px; line-height: 18px; color: var(--w-text2); }
.w-group { margin: 0 var(--w-gutter); }

/* Platform switch */
.w-switch { width: 51px; height: 31px; border-radius: 16px; background: var(--w-fill-strong); position: relative; flex: none; }
.w-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--w-thumb); box-shadow: 0 2px 4px rgba(0, 0, 0, .18); }
.w-switch.on { background: var(--w-ink); }
.w-switch.on::after { left: 22px; }
.w-switch.on::after { background: var(--w-on-ink); }
.phone[data-platform="android"] .w-switch { width: 52px; height: 32px; border: 2px solid var(--w-border); background: var(--w-fill); }
.phone[data-platform="android"] .w-switch::after { width: 16px; height: 16px; top: 6px; left: 6px; background: var(--w-border); box-shadow: none; }
.phone[data-platform="android"] .w-switch.on { border-color: var(--w-ink); background: var(--w-ink); }
.phone[data-platform="android"] .w-switch.on::after { width: 24px; height: 24px; top: 2px; left: 22px; background: var(--w-on-ink); }

/* ── Chips ─────────────────────────────────────────────────────────────── */
.w-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.w-chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--w-fill); color: var(--w-text); font-size: 15px; line-height: 20px; font-weight: 500; letter-spacing: 0.004em; white-space: nowrap; }
.w-chip.sel { background: var(--w-ink); color: var(--w-on-ink); padding-left: 10px; }
.w-chip.decide { color: var(--w-ember-text); }
.w-chip.decide.sel { padding-left: 10px; }
.w-chip.decide.sel { background: var(--w-ember-soft); color: var(--w-ember-text); }
.w-chip.idea { height: auto; min-height: 36px; padding: 8px 14px; white-space: normal; text-align: left; }

/* ── Fields ────────────────────────────────────────────────────────────── */
.w-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--w-text2); margin-bottom: 6px; }
.w-field { min-height: 48px; padding: 12px 14px; border-radius: 14px; background: var(--w-surface); border: 1px solid var(--w-border); font-size: 17px; line-height: 22px; color: var(--w-text); display: flex; align-items: center; gap: 8px; }
.w-field.area { align-items: flex-start; min-height: 112px; padding: 14px 16px; line-height: 24px; }
.w-field.focus { border: 2px solid var(--w-ink); padding: 11px 13px; }
.w-field.area.focus { padding: 13px 15px; }
.w-field .ph { color: var(--w-text2); }
.w-field .caret { display: inline-block; width: 2px; height: 22px; background: var(--w-text); margin-left: 1px; vertical-align: -4px; border-radius: 1px; }
.w-field.send { padding-right: 6px; border-radius: 24px; min-height: 48px; }
.w-sendbtn { width: 36px; height: 36px; flex: none; border-radius: 18px; background: var(--w-ember); color: var(--w-on-ember); display: inline-flex; align-items: center; justify-content: center; margin-left: auto; }
.w-sendbtn.off { background: var(--w-fill); color: var(--w-text3); }
.w-helper { font-size: 13px; line-height: 18px; color: var(--w-text2); margin-top: 8px; }

/* ── Sheet, scrim, menu, toast ─────────────────────────────────────────── */
.w-scrim { position: absolute; inset: 0; background: var(--w-scrim); z-index: 20; }
.w-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--w-sheet); border-radius: 28px 28px 0 0; box-shadow: var(--w-shadow-raised), var(--w-highlight); display: flex; flex-direction: column; }
.w-sheet.large { top: 66px; }
.phone[data-platform="android"] .w-sheet.large { top: 52px; }
.w-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--w-fill-strong); margin: 6px auto 0; flex: none; }
.w-grabber, .w-sheet-head { position: relative; }
.w-sheet.glow { overflow: hidden; }
.w-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 var(--w-gutter); min-height: 44px; flex: none; }
.w-sheet-head .w-iconbtn.filled > span { width: 30px; height: 30px; }
.w-sheet-body { flex: 1; overflow: hidden; position: relative; }
/* Inside a sheet, groups step up to sheet-group (light: white on the warm sheet; dark: one step lighter). */
.w-sheet .w-list, .w-sheet .w-field, .w-sheet .s-card, .w-sheet .s-list, .w-sheet .w-tl-card { background: var(--w-sheet-group); }
.w-bottom-safe-ios { height: 34px; flex: none; }
.w-bottom-safe-android { height: 24px; flex: none; }
.w-menu { position: absolute; z-index: 22; width: 248px; background: var(--w-raised); border-radius: 20px; box-shadow: var(--w-shadow-raised), var(--w-highlight); overflow: hidden; }
.w-menu .m-row { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; font-size: 17px; }
.w-menu .m-row svg { color: var(--w-text2); }
.w-menu .m-row.danger { color: var(--w-danger-text); }
.w-menu .m-row.danger svg { color: var(--w-danger-text); }
.w-menu .m-sep { height: 8px; background: var(--w-fill); opacity: .6; }
.w-menu .m-row + .m-row { border-top: 0.5px solid var(--w-sep); }
.w-toast { position: absolute; left: 50%; transform: translateX(-50%); z-index: 25; min-height: 48px; max-width: 350px; width: max-content; display: flex; align-items: center; gap: 16px; padding: 12px 8px 12px 18px; border-radius: 999px; background: var(--w-raised); box-shadow: var(--w-shadow-float), var(--w-highlight); font-size: 15px; line-height: 20px; }
.w-toast .ta { font-weight: 600; font-size: 17px; padding: 0 10px; }
.w-toast .ta.ember { color: var(--w-ember-text); }

/* ── Tiles and the home grid ───────────────────────────────────────────── */
.w-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 20px; padding: 0 var(--w-gutter); }
.w-cell { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.w-tile { position: relative; width: var(--tile, 64px); height: var(--tile, 64px); flex: none; }
.w-tile > svg.sq { position: absolute; inset: 0; width: 100%; height: 100%; }
.w-tile .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.w-tile .badge { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 9px; background: var(--w-danger); color: var(--w-on-danger); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--w-bg); }
.w-tile .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--w-glow-mid) 70%, transparent)); }
.w-tile .ring path { fill: none; stroke: var(--w-glow-mid); }
.w-cell .nm { margin-top: 6px; width: 100%; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.012em; color: var(--w-text); text-align: center; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; text-wrap: balance; }
.w-cell .st { width: 100%; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.012em; text-align: center; text-wrap: balance; }
.w-composer { position: absolute; left: var(--w-gutter); right: var(--w-gutter); z-index: 10; height: 52px; border-radius: 26px; background: var(--w-raised); box-shadow: var(--w-shadow-float), var(--w-highlight); display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px; color: var(--w-text2); font-size: 17px; }
.w-orb { position: absolute; right: 16px; z-index: 10; width: 44px; height: 44px; border-radius: 22px; background: var(--w-raised); box-shadow: var(--w-shadow-float), var(--w-highlight); display: flex; align-items: center; justify-content: center; }
.w-orb .dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 4px; background: var(--w-ember); box-shadow: 0 0 0 2px var(--w-raised); }
.w-orb.leading { right: auto; left: 16px; }
.w-orb-zone { position: absolute; left: 0; right: 0; z-index: 9; pointer-events: none; }

/* ── Status line, steps, notices, badges ───────────────────────────────── */
.w-status { display: flex; align-items: center; gap: 8px; color: var(--w-text2); font-size: 15px; line-height: 20px; }
.w-ember-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--w-ember); flex: none; }
.w-steps { display: flex; flex-direction: column; gap: 14px; }
.w-step { display: flex; align-items: center; gap: 12px; font-size: 17px; line-height: 22px; }
.w-step .s-ring { width: 22px; height: 22px; flex: none; border-radius: 11px; border: 1.5px solid var(--w-border); display: flex; align-items: center; justify-content: center; }
.w-step.done { color: var(--w-text2); }
.w-step.done .s-ring { border: 0; color: var(--w-text); }
.w-step.now { font-weight: 600; }
.w-step.now .s-ring { border-color: var(--w-ember); }
.w-step .s-sub { display: block; font-size: 13px; line-height: 18px; font-weight: 400; color: var(--w-text2); }
.w-step.todo { color: var(--w-text2); }
.w-step .s-time { margin-left: auto; font-weight: 400; color: var(--w-text2); font-variant-numeric: tabular-nums; font-size: 15px; }
.w-notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--w-fill); font-size: 15px; line-height: 20px; }
.w-notice svg { flex: none; margin-top: 0; color: var(--w-text2); }
.w-notice.danger { background: var(--w-danger-soft); }
.w-notice.danger svg { color: var(--w-danger-text); }
.w-badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.012em; background: var(--w-fill); color: var(--w-text2); white-space: nowrap; }
.w-badge.ink { background: var(--w-ink); color: var(--w-on-ink); }
.w-badge.ember { background: var(--w-ember-soft); color: var(--w-ember-text); }
.w-badge.pos { background: var(--w-pos-soft); color: var(--w-pos-text); }
.w-badge.danger { background: var(--w-danger-soft); color: var(--w-danger-text); }
.w-badge.warn { background: var(--w-warn-soft); color: var(--w-warn-text); }

/* ── Plan and questions ────────────────────────────────────────────────── */
.w-q { padding: 16px; }
.w-q + .w-q { border-top: 0.5px solid var(--w-sep); }
.w-q .q-text { font-size: 17px; line-height: 22px; font-weight: 600; margin-bottom: 12px; }
.w-q .q-hint { font-size: 13px; line-height: 18px; color: var(--w-text2); margin: -8px 0 12px; }
.w-planrow { padding: 14px 16px; position: relative; }
.w-planrow + .w-planrow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--w-sep); }
.w-planrow .p-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--w-text2); display: flex; justify-content: space-between; align-items: center; }
.w-planrow .p-text { font-size: 17px; line-height: 24px; margin-top: 2px; padding-right: 8px; }
.w-skel { background: var(--w-fill-strong); border-radius: 8px; opacity: .6; }

/* ── History timeline ──────────────────────────────────────────────────── */
.w-tl { position: relative; padding-left: 44px; }
.w-tl-row:not(:last-child)::after { content: ""; position: absolute; left: -18px; top: 16px; bottom: -8px; width: 2px; background: var(--w-sep); border-radius: 1px; }
.w-tl-row { position: relative; padding: 0 var(--w-gutter) 22px 0; }
.w-tl-row .dot { position: absolute; left: -22px; top: 8px; width: 10px; height: 10px; border-radius: 5px; background: var(--w-border); box-shadow: 0 0 0 3px var(--w-bg); z-index: 1; }
.w-tl-row.current .dot { background: var(--w-ink); width: 12px; height: 12px; left: -23px; top: 7px; }
.w-tl-row .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--w-text2); font-variant-numeric: tabular-nums; }
.w-tl-card { background: var(--w-surface); border-radius: 20px; padding: 14px 16px; margin-top: 2px; }

/* ── Keyboard mock ─────────────────────────────────────────────────────── */
.w-kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--w-kbd); padding: 8px 3px 0; }
.w-kbd .k-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
.w-kbd .k { height: 42px; flex: 0 0 calc((100% - 9 * 6px - 6px) / 10); border-radius: 5px; background: var(--w-key); color: var(--w-key-text); display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.w-kbd .k.alt { background: var(--w-key-alt); font-size: 15px; }
.w-kbd .k.wide { flex: 0 0 calc((100% - 9 * 6px - 6px) / 10 * 1.3); }
.w-kbd .k.space { flex: 1 1 auto; }
.w-kbd .k.ret { flex: 0 0 24%; }
.phone[data-platform="android"] .w-kbd .k { border-radius: 8px; height: 44px; box-shadow: none; }
.w-kbd .k-sugg { height: 36px; display: flex; align-items: center; justify-content: space-around; color: var(--w-key-text); font-size: 16px; margin: -4px 0 6px; }

/* ── Ember ─────────────────────────────────────────────────────────────── */
.w-ember { position: relative; flex: none; display: inline-block; }
.w-ember svg { overflow: visible; }
.w-ambient { position: absolute; pointer-events: none; z-index: 0; border-radius: 50%; }

/* ── In-app (SDK) components ───────────────────────────────────────────── */
.s-app { --a-fill: var(--t-fill); --a-on: var(--t-on); --a-text: var(--t-text); }
.s-header { padding: 0 var(--w-gutter); }
.s-title { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.012em; }
.s-card { background: var(--w-surface); border-radius: 20px; padding: 20px; }
.s-stack { display: flex; flex-direction: column; gap: 12px; }
.s-row { display: flex; align-items: center; gap: 12px; }
.s-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 26px; font-weight: 600; font-size: 17px; background: var(--a-fill); color: var(--a-on); }
.s-btn.secondary { background: var(--w-fill); color: var(--w-text); }
.s-btn.ghost { background: transparent; color: var(--a-text); }
.s-btn.danger { background: var(--w-danger-soft); color: var(--w-danger-text); }
.s-btn.sm { width: auto; height: 44px; border-radius: 22px; padding: 0 18px; font-size: 15px; }
.s-btn.disabled { background: var(--w-fill); color: var(--w-text3); }
.s-stepper { display: flex; align-items: center; justify-content: space-between; }
.s-stepper .grp { display: flex; align-items: center; background: var(--w-fill); border-radius: 22px; height: 40px; }
.s-stepper .grp button { width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--w-text); }
.s-stepper .val { min-width: 36px; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.s-seg { display: flex; background: var(--w-fill); border-radius: 18px; padding: 2px; height: 36px; }
.s-seg span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; border-radius: 16px; color: var(--w-text); }
.s-seg span.on { background: var(--w-thumb); box-shadow: var(--w-shadow-raised); }
.phone[data-scheme="dark"] .s-seg span.on { box-shadow: none; }
.s-switch { width: 48px; height: 28px; border-radius: 14px; background: var(--w-fill-strong); position: relative; flex: none; }
.s-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px; background: var(--w-thumb); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.s-switch.on::after { background: var(--a-on); }
.phone[data-platform="android"] .s-switch { width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--w-border); background: var(--w-fill); }
.phone[data-platform="android"] .s-switch::after { width: 16px; height: 16px; top: 6px; left: 6px; background: var(--w-border); box-shadow: none; }
.phone[data-platform="android"] .s-switch.on { border-color: var(--a-fill); background: var(--a-fill); }
.phone[data-platform="android"] .s-switch.on::after { width: 24px; height: 24px; top: 2px; left: 22px; background: var(--a-on); }
.s-switch.on { background: var(--a-fill); }
.s-switch.on::after { left: 22px; }
.s-check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--w-border); flex: none; display: flex; align-items: center; justify-content: center; }
.s-check.on { background: var(--a-fill); border-color: var(--a-fill); color: var(--a-on); }
.s-slider { position: relative; height: 28px; }
.s-slider .tr { position: absolute; left: 0; right: 0; top: 11px; height: 6px; border-radius: 3px; background: var(--w-fill-strong); }
.s-slider .fi { position: absolute; left: 0; top: 11px; height: 6px; border-radius: 3px; background: var(--a-fill); }
.s-slider .th { position: absolute; top: 0; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: var(--w-thumb); box-shadow: var(--w-shadow-raised); }
.s-bar { height: 6px; border-radius: 3px; background: var(--w-fill-strong); overflow: hidden; }
.s-bar > span { display: block; height: 100%; border-radius: 3px; background: var(--a-fill); }
.s-badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 600; letter-spacing: 0.012em; background: var(--t-soft); color: var(--a-text); }
.s-badge.neutral { background: var(--w-fill); color: var(--w-text2); }
.s-badge.positive { background: var(--w-pos-soft); color: var(--w-pos-text); }
.s-badge.warning { background: var(--w-warn-soft); color: var(--w-warn-text); }
.s-badge.danger { background: var(--w-danger-soft); color: var(--w-danger-text); }
.s-list { background: var(--w-surface); border-radius: 20px; overflow: hidden; }
.s-item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; position: relative; }
.s-item + .s-item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--w-sep); }
.s-item .i-main { flex: 1; min-width: 0; }
.s-item .i-sub { font-size: 15px; line-height: 20px; color: var(--w-text2); }
.s-item .i-trail { color: var(--w-text2); font-size: 15px; font-variant-numeric: tabular-nums; }
.s-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 16px; }
.s-empty .e-icon { width: 64px; height: 64px; border-radius: 32px; background: var(--w-fill); display: flex; align-items: center; justify-content: center; color: var(--w-text2); margin-bottom: 4px; }
.s-toast { position: absolute; left: 50%; transform: translateX(-50%); z-index: 12; padding: 12px 18px; border-radius: 999px; background: var(--w-raised); box-shadow: var(--w-shadow-float), var(--w-highlight); font-size: 15px; white-space: nowrap; }

/* ── C1 additions ──────────────────────────────────────────────────────── */
.w-tile .badge.warn { background: var(--w-warn); color: #1A1614; }
/* Answers longer than 20 characters: full-width radio (single) or checkbox (multi) rows. */
.w-opts { display: flex; flex-direction: column; margin: 0 -16px -16px; }
.w-opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 12px 16px; font-size: 17px; line-height: 22px; position: relative; }
.w-opt + .w-opt::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; height: 0.5px; background: var(--w-sep); }
.w-opt .mk { width: 22px; height: 22px; flex: none; border-radius: 11px; border: 1.5px solid var(--w-border); display: flex; align-items: center; justify-content: center; }
.w-opt.multi .mk { border-radius: 6px; }
.w-opt.sel .mk { border: 7px solid var(--w-ink); }
.w-opt.multi.sel .mk { border: 0; background: var(--w-ink); color: var(--w-on-ink); }
.w-opt.decide { color: var(--w-ember-text); }
.w-opt.decide.sel .mk { border-color: var(--w-ember); }
.w-q.done { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 52px; }
.w-q.done .q-sum { flex: 1; min-width: 0; font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-q.done .q-sum b { font-weight: 600; }
.w-q.done .q-sum span { color: var(--w-text2); }
.w-q.done .q-edit { color: var(--w-text2); flex: none; }
.w-hero-quote { font-size: 20px; line-height: 25px; font-weight: 500; font-style: italic; letter-spacing: -0.004em; color: var(--w-text); text-wrap: pretty; }
.w-menu .m-head { padding: 14px 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid var(--w-sep); }
.w-menu .m-head .t-headline { min-width: 0; }
.w-skel-tile { border-radius: 30%; background: var(--w-fill-strong); opacity: .6; }
/* Text-size previews: the shell's type grows with the phone's setting. */
.ts .t-large { font-size: calc(34px * var(--ts)); line-height: calc(40px * var(--ts)); }
.ts .w-cell .nm, .ts .w-cell .st { font-size: calc(12px * var(--ts)); line-height: calc(16px * var(--ts)); }
.ts .w-composer { font-size: calc(17px * var(--ts)); height: auto; min-height: 52px; padding-block: 10px; }
.w-applist { display: flex; flex-direction: column; }
.w-applist .ar { display: flex; align-items: center; gap: 16px; padding: 10px 0; position: relative; }
.w-applist .ar + .ar::before { content: ""; position: absolute; top: 0; left: 80px; right: 0; height: 0.5px; background: var(--w-sep); }
/* Native pickers inside the app's WebView follow color-scheme: light dark. */
.n-pop { position: absolute; z-index: 23; background: var(--w-raised); border-radius: 14px; box-shadow: var(--w-shadow-float), var(--w-highlight); overflow: hidden; }
.n-pop .n-row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; font-size: 17px; }
.n-pop .n-row + .n-row { border-top: 0.5px solid var(--w-sep); }
.n-pop .n-row .ck { width: 18px; flex: none; color: var(--w-text); }
.n-cal { padding: 14px 14px 10px; }
.n-cal .hd { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 600; padding: 0 4px 10px; }
.n-cal .hd span:last-child { display: flex; gap: 18px; color: var(--t-text); }
.n-cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; font-size: 17px; line-height: 40px; font-variant-numeric: tabular-nums; }
.n-cal .grid .dw { font-size: 12px; line-height: 20px; font-weight: 600; color: var(--w-text2); }
.n-cal .grid .on { justify-self: center; width: 40px; height: 40px; border-radius: 20px; background: var(--t-fill); color: var(--t-on); font-weight: 600; }
.n-cal .grid .today { color: var(--t-text); font-weight: 600; }
.n-dialog { position: absolute; z-index: 23; left: 24px; right: 24px; background: var(--w-raised); border-radius: 28px; box-shadow: var(--w-shadow-float); padding: 22px 0 10px; }
.n-dialog .t { font-size: 22px; line-height: 28px; padding: 0 24px 14px; }
.n-dialog .n-row { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 24px; font-size: 16px; }
.n-dialog .rd { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--w-text2); flex: none; }
.n-dialog .rd.on { border: 6px solid var(--t-fill); }
.n-dialog .acts { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 0; }
.n-dialog .acts span { padding: 10px 12px; font-size: 15px; font-weight: 600; color: var(--t-text); }
.w-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 12px; background: var(--w-fill); color: var(--w-text2); font-size: 17px; }
.w-search .caret { display: inline-block; width: 2px; height: 20px; background: var(--w-text); vertical-align: -4px; margin-left: 1px; border-radius: 1px; }
.w-search .clr { width: 18px; height: 18px; border-radius: 9px; background: var(--w-text2); color: var(--w-bg); display: flex; align-items: center; justify-content: center; flex: none; }
.w-swatches { display: flex; justify-content: space-between; gap: 6px; }
.w-swatch { width: 28px; height: 28px; border-radius: 14px; background: var(--t-plate); box-shadow: inset 0 0 0 1.5px var(--t-rim); flex: none; }
.w-swatch.sel { box-shadow: inset 0 0 0 1.5px var(--t-rim), 0 0 0 2px var(--w-sheet), 0 0 0 4px var(--w-ink); }
.w-glyphs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
.w-glyph { height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--w-text); }

// Superellipse (n = 5) on a 100 box: the tile shape on both platforms.
const SQUIRCLE = (() => {
  const n = 5, pts = [];
  for (let i = 0; i < 96; i++) {
    const t = (i / 96) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    const x = 50 + 50 * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const y = 50 + 50 * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(`${x.toFixed(2)},${y.toFixed(2)}`);
  }
  return 'M' + pts.join('L') + 'Z';

// Whim mockups: the six springs from 01-direction.md §9.2, a small interruptible spring driver,
// and the helpers the motion page uses (momentum projection, rubber band, CSS linear() sampling).

const SPRINGS = {
  instant: { response: 0.12, damping: 1.0, use: 'Press-in' },
  snappy: { response: 0.28, damping: 1.0, use: 'Press-out, toggles, selection' },
  smooth: { response: 0.40, damping: 1.0, use: 'Push, pop, sheets, steps' },
  fling: { response: 0.35, damping: 0.80, use: 'Released drags, with velocity' },
  morph: { response: 0.50, damping: 0.90, use: 'Tile to app, ghost to tile' },
  spark: { response: 0.55, damping: 0.55, use: 'Rare celebrations' },
};

function springConsts(cfg) {
  const w = (2 * Math.PI) / cfg.response;

// A value that springs toward a target. Retargeting keeps position and velocity, so motion never jumps.
class SpringValue {

    this.cfg = SPRINGS.smooth; this.precision = precision; this.onRest = null;
  }
  to(target, cfg = SPRINGS.smooth, velocity) {
    this.target = target; this.cfg = cfg;
    if (velocity !== undefined) this.v = velocity;
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.step(t)); }
  }
  set(x) { this.stop(); this.x = x; this.v = 0; this.target = x; this.onUpdate(x); }
  stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; }
  step(t) {
    const dt = Math.min((t - this.last) / 1000, 1 / 20); this.last = t;
    const { k, c } = springConsts(this.cfg);
    const n = Math.max(1, Math.ceil(dt * 480)), h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -k * (this.x - this.target) - c * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    this.onUpdate(this.x);
    if (Math.abs(this.x - this.target) < this.precision && Math.abs(this.v) < this.precision * 10) {
      this.x = this.target; this.v = 0; this.onUpdate(this.x); this.raf = 0;
      if (this.onRest) this.onRest();
      return;
    }
    this.raf = requestAnimationFrame((tt) => this.step(tt));

// Progressive resistance past a bound.
function rubberband(over, dim, c = 0.55) { return (over * dim * c) / (dim + c * Math.abs(over)); }

// Velocity tracker over the last ~80 ms of pointer samples.
class VelocityTracker {

  add(x, t = performance.now()) { this.s.push([x, t]); while (this.s.length > 2 && t - this.s[0][1] > 80) this.s.shift(); }

}

// Top of the first grid row, for overlays.
function cellRect(c, index) {

// The orb is a native view above the WebView, so it is drawn in the overlay layer, above any SDK Modal.
function orb(c, { side = 'trailing', state = 'rest', dot = false } = {}) {

}

function appFrame(c, app, inner, { orb: showOrb = true, orbSide = 'trailing', orbState = 'rest', dot = false, overlay = '', back = false, title = '', action = '', kbd = false, pad = '16px 20px 0' } = {}) {
  const g = G(c);
  const head = title ? `${header(c, { back, right: action })}<div class="s-header"><div class="s-title">${esc(title)}</div></div>` : '';

  return frame(c, body, { overlay: overlay + (showOrb && !kbd ? orb(c, { side: orbSide, state: orbState, dot }) : '') + (kbd ? keyboard(c, { sugg: kbd === true ? ['walk', 'Walk', 'walking'] : kbd }) : '') });
}

function ring(value, size, label, sub, stroke = 10) {

function viewOverview() {
  const cw = contentWidth(), { W } = dims(PG.platform), n = schemes().length;
  const narrow = cw < 720;
  const scale = narrow ? Math.min(.62, (cw - (n - 1) * 12) / (n * W)) : (cw >= 1200 ? .5 : .46);
  const hero = `<section class="pg-hero"><div><div class="pg-flabel" style="color:var(--pg-accent)">Design system v1 · for review</div><h1>Whim, made calm, honest and yours</h1>
<p class="lead">One system for the shell and every app Whim makes. System type, light and dark, an ember that only glows while Whim is working, and apps that wear their own colour. Tap any screen to see it on both platforms, in both themes, or <a href="#prototype" style="color:var(--pg-accent);font-weight:600">tap through the prototype</a>.</p>
<ul class="pg-moves">
<li><b>One system, two renderers</b>The launcher and the apps share type, space, shape and motion.</li>
<li><b>Hue says who</b>Warm is Whim and status; your apps wear ten cool tints; ink is the system.</li>
<li><b>System fonts, light and dark</b>SF on iPhone, Roboto on Android, following the phone.</li>
<li><b>Glyph tiles</b>Each app picks a tint and an icon by name. No monograms, no generated art.</li>
<li><b>Honest light</b>The ember is a light, not a character. It glows with the real stream; stuck looks stuck; out means it didn’t work.</li>
<li><b>Springs and gestures</b>Six springs, everything interruptible; shell screens get the system’s own back gesture.</li>
<li><b>Fewer steps</b>Questions live on the plan; changing an app never closes it.</li>
<li><b>Your words first</b>What you asked for, quoted, leads the plan, the making page, Ready and History.</li>
</ul></div>
<div class="pg-hero-art">${frameHTML(SCREENS.find((s) => s.id === 'home'), { p: PG.platform, s: 'light' }, narrow ? .5 : .5)}${narrow ? '' : frameHTML(SCREENS.find((s) => s.id === 'making'), { p: PG.platform, s: 'dark' }, .5)}</div></section>`;
  const story = (title, sub, steps) => {
    const nf = steps.length, sc = narrow ? Math.min(.42, (cw - 20) / (2 * W)) : Math.min(.36, (cw - 44 - (nf - 1) * 96) / (nf * W));
    const items = steps.map(([id, label], i) => `${i ? `<div class="pg-arrow"><span>→</span><small>${esc(label)}</small></div>` : ''}<a href="#s-${id}" class="pg-storyframe">${frameHTML(SCREENS.find((s) => s.id === id), { p: PG.platform, s: PG.scheme === 'dark' ? 'dark' : 'light' }, sc)}</a>`).join('');
    return `<div class="pg-story"><h3>${esc(title)}</h3><p>${esc(sub)}</p><div class="pg-storyrow">${items}</div></div>`;
  };
  const flows = `<section class="pg-section"><h2>The two flows</h2><p class="sub">Making an app and changing one, frame by frame. The labels name the motion between frames (05-motion.md).</p>
${story('Make an app', 'From the composer to the running app: four taps, one sheet, the ember at work in the middle.', [['home', ''], ['describe', 'M6 the composer grows into the sheet'], ['plan', 'M7 push; questions land first'], ['making', 'M9 the ember takes the centre'], ['ready', 'M10 one flare; the tile rises'], ['app-opening', 'M2 a bg container grows from the tile'], ['app-timer', 'the app paints; the plate fades']])}
${story('Change an app while using it', 'The app never closes. The change is made in the background and offered with Reload.', [['app-timer', ''], ['whim-sheet', 'M21 the Whim sheet rises from the orb'], ['whim-plan', 'M11 the sheet grows; the plan for the change'], ['app-changing', 'M5 back into the orb, which glows while it works']])}</section>`;
  const code = (s) => (s.code ? `<pre class="pg-code">${esc(s.code)}</pre>` : '');
  const groups = GROUPS.map((g) => {
    const cards = SCREENS.filter((s) => s.group === g).map((s) => `<article class="pg-card" style="--note-w:${Math.round(W * scale * n + (n - 1) * 12)}px"><h3><a href="#s-${s.id}">${esc(s.title)}</a></h3><a href="#s-${s.id}" aria-label="Open ${esc(s.title)}" class="pg-frames" style="text-decoration:none">${schemes().map((sc) => frameHTML(s, { p: PG.platform, s: sc }, scale)).join('')}</a><p>${esc(s.note)}</p>${code(s)}</article>`).join('');
    return `<section class="pg-section" id="g-${g.replace(/\W+/g, '-').toLowerCase()}"><h2>${esc(g)}</h2><p class="sub">${esc(GROUP_NOTES[g])}</p><div class="pg-cards">${cards}</div></section>`;
  }).join('');
  return hero + flows + groups;
}

// ── Motion wiring ───────────────────────────────────────────────────────────
function cssColor(name, el) { return getComputedStyle(el || document.documentElement).getPropertyValue(name).trim(); }

function wireMotion(root) {
  const rmBtn = root.querySelector('#rm-toggle');
  const setRM = (on) => { REDUCED = on; rmBtn.textContent = `Reduce Motion: ${on ? 'on' : 'off'}`; rmBtn.setAttribute('aria-pressed', String(on)); };
  setRM(REDUCED);
  rmBtn.addEventListener('click', () => setRM(!REDUCED));

  // Spring curves and tracks
  const accent = cssColor('--pg-accent'), line = cssColor('--pg-line'), text2 = cssColor('--pg-text2');

    const s = SPRINGS[cv.dataset.spring], ctx = cv.getContext('2d'), W = cv.width, H = cv.height;

  root.querySelectorAll('[data-track]').forEach((tr) => {

    const span = () => tr.clientWidth - 28;
    const sv = new SpringValue(0, (p) => { ball.style.transform = `translateX(${p * span()}px)`; });
    const go = () => { if (REDUCED) { sv.set(sv.target > .5 ? 0 : 1); return; } sv.to(sv.target > .5 ? 0 : 1, cfg); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });

  // Press

    const target = el.classList.contains('w-tile') ? .96 : .97;
    const sv = new SpringValue(1, (s) => { if (REDUCED) { el.style.transform = ''; el.style.opacity = String(1 - .3 * Math.min(1, (1 - s) / (1 - target))); } else { el.style.transform = `scale(${s})`; el.style.opacity = ''; } });

    const up = () => { if (!down) return; down = false; sv.to(1, SPRINGS.snappy); };
    el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
  });

  // Sheet
  const sd = root.querySelector('[data-sheet-demo]');
  if (sd) {
    const sheet = sd.querySelector('.w-sheet'), scrim = sd.querySelector('.w-scrim'), H = 330;
    const apply = (y) => { if (REDUCED && !dragging) { sheet.style.transform = `translateY(${y > H / 2 ? H + 20 : 0}px)`; sheet.style.opacity = String(Math.max(0, 1 - y / H)); } else { sheet.style.transform = `translateY(${y}px)`; sheet.style.opacity = ''; } scrim.style.opacity = String(Math.max(0, Math.min(1, 1 - y / H))); };

    };

  }

    let from = null, opening = false; const SW = 320, SH = 560;
    layer.style.overflow = 'hidden'; layer.style.background = 'var(--w-bg)';
    const draw = (p) => {
      if (!from) return;
      const q = Math.max(0, Math.min(1, p));
      if (REDUCED) { Object.assign(layer.style, { left: '0px', top: '0px', width: SW + 'px', height: SH + 'px', borderRadius: '32px', opacity: String(q) }); plateEl.style.opacity = '0'; appC.style.opacity = String(q); return; }
      layer.style.opacity = '1';
      const x = from.x * (1 - p), y = from.y * (1 - p), w = from.w + (SW - from.w) * p, h = from.h + (SH - from.h) * p;

  }

  // Ghost to tile
  const tm = root.querySelector('[data-transmute]');
  if (tm) {
    const holder = tm.querySelector('.tm-tile');
    const build = () => {
      holder.innerHTML = `<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="${SQUIRCLE}" style="fill:var(--w-ember-soft)"/></svg><div class="tm-fill tint-stone" style="position:absolute;inset:0;clip-path:circle(0% at 50% 50%)"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="${SQUIRCLE}" style="fill:var(--t-fill)"/></svg><div class="tm-glyph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t-on);opacity:0">${icon('timer', 48, 2)}</div></div><div class="tm-ember" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${emberMark({ size: 48, activity: 1 })}</div>`;
    };
    build();
    const fill = () => holder.querySelector('.tm-fill'), glyph = () => holder.querySelector('.tm-glyph'), ember = () => holder.querySelector('.tm-ember');
    const m = new SpringValue(0, (p) => { fill().style.clipPath = `circle(${(p * 72).toFixed(1)}% at 50% 50%)`; glyph().style.opacity = String(p); glyph().style.transform = `scale(${.9 + .1 * p})`; ember().style.opacity = String(1 - p); });
    const g = new SpringValue(1, (s) => { ember().style.transform = `scale(${s})`; });
    const [deliver, reset] = tm.querySelectorAll('.w-btn');
    deliver.addEventListener('click', () => {
      if (REDUCED) { m.set(1); return; }
      g.set(1); g.to(1.18, SPRINGS.spark); setTimeout(() => { g.to(1, SPRINGS.spark); m.to(1, SPRINGS.morph); }, 140);

  }

  // Honest light
  const hl = root.querySelector('[data-honest]');
  if (hl) {
    const holder = hl.querySelector('.hl-wisp'), line = hl.querySelector('.hl-line'), rate = root.querySelector('#hl-rate'), stallBtn = root.querySelector('#hl-stall');
    let pose = 'working', stalled = false, last = performance.now(), lastArrival = performance.now(), flick = 0, alive = true;
    const render = () => { holder.innerHTML = emberMark({ size: 128, state: pose === 'stuck' ? 'stuck' : 'working', activity: 1 }); };
    render();
    const act = new SpringValue(.6, () => {}, { precision: .0005 }); act.cfg = { response: .6, damping: 1 };
    stallBtn.addEventListener('click', () => { stalled = !stalled; stallBtn.textContent = stalled ? 'Resume the stream' : 'Stall the stream'; });
    const tick = (t) => {

      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

      val.textContent = String(n); val.appendChild(out);

  // Orb: drag between two corners, snapping by momentum projection
  const od = root.querySelector('[data-orbdrag]');
  if (od) {
    const o = od.querySelector('.od-orb'), W = 320, M = 16, OW = 44, xs = [M, W - M - OW];
    let dragging = false, sx = 0, sy = 0, startX = 0, y = 0; const vt = new VelocityTracker();

    const sv = new SpringValue(0, apply, { precision: .3 });
    apply(0);
    topEl.addEventListener('pointerdown', (e) => { const r = topEl.getBoundingClientRect(); if (e.clientX - r.left > 28 && sv.x === 0) return; dragging = true; sv.stop(); sx = e.clientX; start = sv.x; vt.reset(); vt.add(e.clientX); topEl.setPointerCapture(e.pointerId); });
    topEl.addEventListener('pointermove', (e) => { if (!dragging) return; const x = Math.max(0, start + e.clientX - sx); sv.x = x; apply(x); vt.add(e.clientX); });
    const rel = () => {
      if (!dragging) return; dragging = false;
      const v = vt.velocity(), end = sv.x + project(v), commit = end > W / 2 && v > -20;
      if (REDUCED) { sv.set(commit ? W : 0); }
      else sv.to(commit ? W : 0, SPRINGS.fling, v);
      again.style.display = commit ? 'block' : 'none';
    };
    topEl.addEventListener('pointerup', rel); topEl.addEventListener('pointercancel', rel);
    swd.addEventListener('click', (e) => { if (e.target.closest('.sw-again') || (sv.target === W && e.target.closest('.sw-under'))) { if (REDUCED) sv.set(0); else sv.to(0, SPRINGS.smooth); again.style.display = 'none'; } });
  }
}


// ── Prototype ───────────────────────────────────────────────────────────────
const CLOSE = '.w-sheet-head .w-iconbtn.filled', BACK = '.w-sheet-head .w-iconbtn:not(.filled)';
const PROTO = {
  home: [['.w-composer', 'describe', 'sheet', 'Make an app'], ['.w-cell:first-child', 'app-timer', 'open', 'Open Pour Timer']],
  describe: [['.w-btn.ember', 'plan-thinking', 'push', 'Continue'], [CLOSE, 'home', 'down', 'Close']],
  'plan-thinking': [['@auto', 'plan', 'fade', 1500], [BACK, 'describe', 'back', 'Back'], [CLOSE, 'home', 'down', 'Close']],
  plan: [['.w-btn.ember', 'making', 'fade', 'Make it'], [BACK, 'describe', 'back', 'Back'], [CLOSE, 'home', 'down', 'Close']],
  making: [['@auto', 'ready|failure', 'fade', 3200], [CLOSE, 'home-states', 'down', 'Close; it keeps going'], ['.w-actions .w-btn.plain', 'home', 'down', 'Stop']],
  ready: [['.w-btn.tint', 'app-timer', 'open', 'Open it'], ['.w-actions .w-btn.plain', 'home', 'down', 'Done'], [CLOSE, 'home', 'down', 'Close']],
  failure: [['.w-actions .w-btn.ink', 'describe', 'push', 'Change the description'], ['.w-actions .w-btn.plain', 'making', 'fade', 'Try again as it is'], ['.w-btn.danger', 'deleted', 'down', 'Discard'], [CLOSE, 'home-states', 'down', 'Close']],
  deleted: [['.w-composer', 'describe', 'sheet', 'Make an app'], ['.w-cell:first-child', 'app-timer', 'open', 'Open Pour Timer']],
  'home-states': [['.w-composer', 'describe', 'sheet', 'Make an app'], ['.w-cell:first-child', 'making', 'sheet', 'Show progress']],
  'app-timer': [['.w-orb', 'whim-sheet', 'sheet', 'Whim menu']],
  'whim-sheet': [['.w-field', 'whim-plan', 'sheet', 'What should change?'], ['.w-sheet .w-row:last-child', 'home', 'down', 'Back to your apps'], ['.w-sheet-head .w-iconbtn.filled', 'app-timer', 'down', 'Close']],
  'whim-plan': [['.w-btn.ember', 'app-changing', 'down', 'Make the change'], [BACK, 'whim-sheet', 'back', 'Back'], [CLOSE, 'app-timer', 'down', 'Close']],
  'app-changing': [['.w-toast .ta', 'app-timer', 'fade', 'Reload'], ['.w-orb', 'whim-sheet', 'sheet', 'Whim menu']],
};
let protoTimer = 0;
function viewPrototype() {
  return `<div class="pg-focus-head"><div><div class="pg-flabel">Prototype</div><h2>Tap through it</h2><p>Make an app, open it, then change it while it runs. Highlighted areas are tappable, including back and close on every sheet. Opening an app grows a container in its canvas colour from the tile; the motion lab has the full gestures.</p></div><div class="pg-row"><label class="pg-btn" style="cursor:pointer"><input type="checkbox" id="proto-fail" style="margin:0 4px 0 0">Make it fail</label><button class="pg-btn dark" id="proto-restart">Start over</button></div></div>
<div class="pg-proto"><div class="pg-proto-stage" id="proto-stage"></div><ol class="pg-proto-steps" id="proto-steps"><li>Tap <b>Make an app…</b></li><li><b>Continue</b>, then answer or skip the choices</li><li><b>Make it</b> and watch the ember work (or tick <b>Make it fail</b> first, for the failure sheet)</li><li><b>Open it</b>: the app grows out of its tile</li><li>Tap the orb in the corner, then <b>What should change?</b></li><li><b>Make the change</b>, then <b>Reload</b></li><li><b>Back to your apps</b> in the Whim sheet closes the app</li></ol></div>`;
}
function wireProto(root) {
  const stage = root.querySelector('#proto-stage'), failBox = root.querySelector('#proto-fail');
  const { W, H } = dims(PG.platform);
  const sc = Math.min(1, (Math.min(contentWidth(), 520)) / W);
  stage.style.width = `${Math.round(W * sc)}px`; stage.style.height = `${Math.round(H * sc)}px`;
  const scheme = PG.scheme === 'dark' ? 'dark' : 'light';
  // linear() springs only where the engine supports them; the nearest cubic-bezier otherwise (iOS 15.1 floor).
  const lin = (cfg, fallback) => { const e = linearEasing(cfg); return { ms: e.ms, css: CSS.supports('animation-timing-function', 'linear(0, 1)') ? e.css : fallback }; };
  const ease = lin(SPRINGS.smooth, 'cubic-bezier(.25, .9, .3, 1)'), easeM = lin(SPRINGS.morph, 'cubic-bezier(.3, 1.1, .4, 1)');
  const show = (id, how, src) => {
    clearTimeout(protoTimer);
    if (id.includes('|')) id = failBox.checked ? id.split('|')[1] : id.split('|')[0];
    const s = SCREENS.find((x) => x.id === id);
    const layer = document.createElement('div');
    layer.className = 'pg-proto-layer';
    layer.style.transform = `scale(${sc})`;
    layer.innerHTML = s.render({ p: PG.platform, s: scheme });
    stage.appendChild(layer);
    const old = [...stage.children].filter((c) => c !== layer);
    const reduced = REDUCED;
    let anim;
    const srcTile = src && (src.classList.contains('w-tile') ? src : src.closest('.w-cell') ? src.closest('.w-cell').querySelector('.w-tile') : src.closest('.phone') && src.closest('.phone').querySelector('.w-sheet .w-tile'));
    if (how === 'open' && !reduced) {
      // M2: a bg container grows from the tile; the tint stays a tile-sized plate and fades as the app paints.
      const sr = stage.getBoundingClientRect(), from = (srcTile || src).getBoundingClientRect();
      const x = (from.left - sr.left) / sc, y = (from.top - sr.top) / sc, w = from.width / sc, h = from.height / sc;
      const g = G({ p: PG.platform }), tileHTML = tile(APPS.pour, { size: g.tile, label: false });
      const cover = document.createElement('div');
      cover.style.cssText = 'pointer-events:none;position:absolute;inset:0;z-index:60;background:var(--w-bg);display:flex;align-items:center;justify-content:center';
      cover.innerHTML = tileHTML;
      layer.querySelector('.phone').appendChild(cover);
      anim = layer.animate([{ clipPath: `inset(${y}px ${W - x - w}px ${H - y - h}px ${x}px round ${w * .3}px)` }, { clipPath: `inset(0px 0px 0px 0px round ${PG.platform === 'ios' ? 54 : 40}px)` }], { duration: easeM.ms, easing: easeM.css });
      cover.animate([{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: easeM.ms + 220, fill: 'forwards' }).onfinish = () => cover.remove();
    } else {
      const frames = { sheet: [{ transform: `translateY(60px) scale(${sc})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], push: [{ transform: `translateX(48px) scale(${sc})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], back: [{ transform: `translateX(-48px) scale(${sc})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], down: [{ transform: `scale(${sc * 1.03})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], fade: [{ opacity: 0 }, { opacity: 1 }] }[how] || [{ opacity: 0 }, { opacity: 1 }];
      anim = layer.animate(reduced ? [{ opacity: 0 }, { opacity: 1 }] : frames, reduced ? { duration: 160, easing: 'ease-out' } : { duration: ease.ms, easing: ease.css });
    }
    anim.onfinish = () => old.forEach((o) => o.remove());
    const hops = PROTO[id] || [];
    hops.forEach(([sel, next, kind, extra]) => {
      if (sel === '@auto') { protoTimer = setTimeout(() => { if (stage.isConnected) show(next, kind); }, extra); return; }
      const el = layer.querySelector(sel);
      if (!el) return;
      el.classList.add('proto-hot'); el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); el.setAttribute('aria-label', extra);
      const go = (e) => { e.stopPropagation(); show(next, kind, el); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
    });
  };
  show('home', 'fade');
  root.querySelector('#proto-restart').addEventListener('click', () => show('home', 'fade'));
}

// ── Shell ───────────────────────────────────────────────────────────────────
function navHTML(route) {
  const link = (h, label) => `<a href="#${h}" class="${(route === h || (h === '' && (route === '' || route.startsWith('s-')))) ? 'on' : ''}">${label}</a>`;
  const seg = (key, opts) => `<div class="pg-seg" role="group" aria-label="${key}">${opts.map(([v, l]) => `<button data-${key}="${v}" class="${PG[key] === v ? 'on' : ''}" aria-pressed="${PG[key] === v}">${l}</button>`).join('')}</div>`;
  return `<div class="pg-bar-in"><a class="pg-brand" href="#">${wispMini()}Whim · system v1</a><nav class="pg-nav">${link('', 'Screens')}${link('components', 'Components')}${link('tokens', 'Tokens')}${link('motion', 'Motion')}${link('prototype', 'Prototype')}</nav><div class="pg-tools">${seg('platform', [['ios', 'iPhone'], ['android', 'Android']])}${seg('scheme', [['both', 'Both'], ['light', 'Light'], ['dark', 'Dark']])}</div></div>`;
}
function wispMini() { return `<span class="phone" data-scheme="light" data-platform="ios" style="--pw:24px;--ph:24px;border-radius:0;background:none;display:inline-flex;overflow:visible">${emberMark({ size: 24, activity: .8 })}</span>`; }

function render() {
  const route = (location.hash || '').replace(/^#/, '');
  document.getElementById('pg-bar').innerHTML = navHTML(route);
  let html;
  if (route.startsWith('s-')) html = viewScreen(route.slice(2));
  else if (route === 'components') html = viewComponents();
  else if (route === 'tokens') html = viewTokens();
  else if (route === 'motion') html = viewMotion();
  else if (route === 'prototype') html = viewPrototype();
  else html = viewOverview();
  const main = document.getElementById('pg-main');
  main.innerHTML = html;
  if (route === 'motion') wireMotion(main);
  if (route === 'prototype') wireProto(main);
  else clearTimeout(protoTimer);
  document.querySelectorAll('[data-platform]').forEach((b) => { if (b.tagName === 'BUTTON') b.addEventListener('click', () => { PG.platform = b.dataset.platform; save(); render(); }); });
  document.querySelectorAll('[data-scheme]').forEach((b) => { if (b.tagName === 'BUTTON') b.addEventListener('click', () => { PG.scheme = b.dataset.scheme; save(); render(); }); });
}

document.body.insertAdjacentHTML('afterbegin', EMBER_DEFS);
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
let rT = 0; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!location.hash.includes('motion') && !location.hash.includes('prototype')) render(); }, 200); });
render();

</script>
