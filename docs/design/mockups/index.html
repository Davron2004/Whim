<title>Whim System v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Page chrome for the Whim system v1 review. Layout: a sticky bar, then one view at a time
   (overview, screen, components, tokens, motion), frames laid out in wrapping rows. */
:root {
  --pg-bg: #E9E6E1; --pg-surface: #F6F4F1; --pg-raised: #FFFFFF; --pg-text: #1A1614; --pg-text2: #625B55;
  --pg-line: #D6D1CA; --pg-accent: #B14200; --pg-chip: #DEDAD4; --pg-chip-on: #1A1614; --pg-chip-on-text: #FFFFFF;
  --pg-font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #0C0B0A; --pg-surface: #171513; --pg-raised: #1F1C1A; --pg-text: #F2F0EC; --pg-text2: #AAA49D;
    --pg-line: #2C2926; --pg-accent: #F99549; --pg-chip: #2A2724; --pg-chip-on: #F2F0EC; --pg-chip-on-text: #1A1614;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pg-bg: #0C0B0A; --pg-surface: #171513; --pg-raised: #1F1C1A; --pg-text: #F2F0EC; --pg-text2: #AAA49D;
  --pg-line: #2C2926; --pg-accent: #F99549; --pg-chip: #2A2724; --pg-chip-on: #F2F0EC; --pg-chip-on-text: #1A1614;
  color-scheme: dark;
}
html, body { background: var(--pg-bg); }
body { margin: 0; color: var(--pg-text); font-family: var(--pg-font); font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.pg-wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 0 80px; }

.pg-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; background: color-mix(in srgb, var(--pg-bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--pg-line); }
.pg-bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.pg-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; text-decoration: none; }
.pg-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.pg-nav a { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--pg-text2); }
.pg-nav a.on { background: var(--pg-chip-on); color: var(--pg-chip-on-text); }
.pg-nav a:focus-visible, .pg-seg button:focus-visible, .pg-btn:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.pg-tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.pg-seg { display: inline-flex; background: var(--pg-chip); border-radius: 999px; padding: 2px; }
.pg-seg button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; color: var(--pg-text2); cursor: pointer; }
.pg-seg button.on { background: var(--pg-raised); color: var(--pg-text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.pg-hero { padding: 56px 0 20px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.pg-hero h1 { font-size: 52px; line-height: 56px; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.pg-hero .lead { font-size: 19px; line-height: 29px; color: var(--pg-text2); margin: 18px 0 0; max-width: 60ch; }
.pg-moves { margin: 28px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
.pg-moves li { font-size: 15px; line-height: 22px; color: var(--pg-text2); padding-left: 0; }
.pg-moves b { color: var(--pg-text); font-weight: 600; display: block; }
.pg-hero-art { display: flex; gap: 16px; justify-content: center; }

.pg-section { margin-top: 56px; }
.pg-section > h2 { font-size: 30px; line-height: 36px; letter-spacing: -0.015em; margin: 0 0 6px; }
.pg-section > p.sub { margin: 0 0 22px; color: var(--pg-text2); max-width: 70ch; }
.pg-cards { display: flex; flex-wrap: wrap; gap: 28px 24px; }
.pg-card { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.pg-card h3 { margin: 0; font-size: 16px; line-height: 22px; }
.pg-card h3 a { text-decoration: none; }
.pg-card h3 a:hover { text-decoration: underline; }
.pg-card p { margin: 0; font-size: 14px; line-height: 20px; color: var(--pg-text2); max-width: var(--note-w, 420px); }
.pg-frames { display: flex; gap: 12px; }
.fw { position: relative; flex: none; border-radius: 34px; }
.fw > .phone { transform-origin: top left; position: absolute; left: 0; top: 0; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 10px 30px rgba(0, 0, 0, .14); }
:root[data-theme="dark"] .fw > .phone { box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 10px 30px rgba(0, 0, 0, .5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fw > .phone { box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 10px 30px rgba(0, 0, 0, .5); } }

.pg-focus-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin: 36px 0 20px; }
.pg-focus-head h2 { margin: 0; font-size: 34px; line-height: 40px; letter-spacing: -0.02em; }
.pg-focus-head p { margin: 6px 0 0; color: var(--pg-text2); max-width: 70ch; }
.pg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--pg-chip); color: var(--pg-text); text-decoration: none; font-size: 14px; font-weight: 600; border: 0; cursor: pointer; font-family: inherit; }
.pg-btn.dark { background: var(--pg-chip-on); color: var(--pg-chip-on-text); }
.pg-scroll { overflow-x: auto; padding-bottom: 12px; }
.pg-scroll .pg-frames { gap: 24px; }
.pg-flabel { font-size: 13px; color: var(--pg-text2); margin-bottom: 8px; font-weight: 600; }

.pg-story { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 22px 22px 18px; margin-top: 18px; }
.pg-story h3 { margin: 0; font-size: 18px; }
.pg-story > p { margin: 4px 0 16px; color: var(--pg-text2); font-size: 14px; }
.pg-storyrow { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
.pg-storyframe { flex: none; text-decoration: none; }
.pg-arrow { flex: none; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--pg-text2); }
.pg-arrow span { font-size: 22px; color: var(--pg-accent); }
.pg-arrow small { font-size: 11.5px; line-height: 15px; }

.pg-proto { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.pg-proto-stage { position: relative; flex: none; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 18px 50px rgba(0, 0, 0, .18); }
.pg-proto-layer { position: absolute; left: 0; top: 0; transform-origin: top left; }
.pg-proto-steps { margin: 0; padding-left: 20px; color: var(--pg-text2); font-size: 15px; line-height: 26px; max-width: 34ch; }
.pg-proto-steps b { color: var(--pg-text); }
.proto-hot { outline: 2px solid color-mix(in srgb, var(--pg-accent) 70%, transparent); outline-offset: 3px; animation: pg-hot 1.6s ease-in-out infinite; cursor: pointer; }
@keyframes pg-hot { 50% { outline-color: color-mix(in srgb, var(--pg-accent) 15%, transparent); } }
@media (prefers-reduced-motion: reduce) { .proto-hot { animation: none; } }

/* Tokens */
.pg-board { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 24px; }
.pg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.pg-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pg-sw { border-radius: 14px; overflow: hidden; border: 1px solid var(--pg-line); background: var(--pg-raised); }
.pg-sw .chipc { height: 52px; display: flex; }
.pg-sw .chipc span { flex: 1; }
.pg-sw .meta { padding: 8px 10px; font-size: 12px; line-height: 16px; }
.pg-sw .meta b { display: block; font-size: 13px; }
.pg-sw code, .pg-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--pg-text2); }
.pg-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pg-table td, .pg-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--pg-line); vertical-align: middle; }
.pg-table th { font-size: 12px; color: var(--pg-text2); font-weight: 600; }
.pg-tablewrap { overflow-x: auto; }
.pg-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.pg-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 8px; border-radius: 12px; font-size: 10.5px; color: var(--pg-text2); text-align: center; word-break: break-word; }
.pg-icon.glyph { background: var(--pg-raised); }
.pg-icon svg { color: var(--pg-text); }

/* Motion */
.pg-demo { background: var(--pg-surface); border: 1px solid var(--pg-line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pg-demo h3 { margin: 0; font-size: 18px; }
.pg-demo p { margin: 0; color: var(--pg-text2); font-size: 14px; line-height: 20px; }
.pg-demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.pg-spring { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--pg-line); }
.pg-spring:last-child { border-bottom: 0; }
.pg-spring canvas { width: 100%; height: 64px; display: block; }
.pg-track { position: relative; height: 28px; border-radius: 14px; background: var(--pg-chip); cursor: pointer; }
.pg-track .ball { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 10px; background: var(--pg-accent); }
.pg-stage { position: relative; display: flex; justify-content: center; }
.pg-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pg-range { width: 100%; }

@media (max-width: 860px) {
  .pg-hero { grid-template-columns: minmax(0, 1fr); padding-top: 32px; }
  .pg-hero h1 { font-size: 38px; line-height: 42px; }
  .pg-moves { grid-template-columns: minmax(0, 1fr); }
  .pg-grid2 { grid-template-columns: minmax(0, 1fr); }
  .pg-tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* Whim system v1: tokens and components, scoped to .phone so every frame carries its own scheme.
   Values are the ones in docs/design/system-v1/01-direction.md. */

.phone {
  --w-bg: #F6F4F1; --w-surface: #FFFFFF; --w-raised: #FFFFFF; --w-fill: #EBE9E6; --w-fill-strong: #E0DDDA;
  --w-sep: #E2DFDB; --w-border: #908B86; --w-text: #1A1614; --w-text2: #6D6660; --w-text3: #908B86;
  --w-ink: #1A1614; --w-on-ink: #FFFFFF; --w-scrim: rgba(26, 22, 20, .32);
  --w-ember: #C14900; --w-on-ember: #FFFFFF; --w-ember-text: #B14200; --w-ember-soft: #FDEBDA;
  --w-glow-core: #FFC96A; --w-glow-mid: #FF9127; --w-glow-edge: #F25914;
  --w-pos: #1E8347; --w-on-pos: #FFFFFF; --w-pos-text: #1A763F; --w-pos-soft: #DEF6E3;
  --w-danger: #C9292F; --w-on-danger: #FFFFFF; --w-danger-text: #C22630; --w-danger-soft: #FFE7E5;
  --w-warn: #F3BA25; --w-on-warn: #1A1614; --w-warn-text: #8A6000; --w-warn-soft: #FDF2D0;
  --w-shadow-raised: 0 1px 2px rgba(26, 22, 20, .08), 0 8px 24px rgba(26, 22, 20, .12);
  --w-shadow-float: 0 2px 6px rgba(26, 22, 20, .12), 0 12px 32px rgba(26, 22, 20, .16);
  --w-highlight: inset 0 0 0 0 transparent;
  --w-kbd: #D1D3D9; --w-key: #FFFFFF; --w-key-text: #1A1614; --w-key-alt: #ABB0BA;
  --w-island: #000000; --w-bar-text: #1A1614;
  --w-gutter: 20px;
  color-scheme: light;
}
.phone[data-scheme="dark"] {
  --w-bg: #100E0D; --w-surface: #1B1917; --w-raised: #252220; --w-fill: #2E2B28; --w-fill-strong: #3C3936;
  --w-sep: #34312F; --w-border: #6E6862; --w-text: #F2F0EC; --w-text2: #ADA8A3; --w-text3: #78746E;
  --w-ink: #F2F0EC; --w-on-ink: #1A1614; --w-scrim: rgba(0, 0, 0, .60);
  --w-ember: #F99549; --w-on-ember: #1A1614; --w-ember-text: #F99549; --w-ember-soft: #3F2313;
  --w-pos: #5BCC80; --w-on-pos: #1A1614; --w-pos-text: #5BCC80; --w-pos-soft: #193521;
  --w-danger: #F66C6D; --w-on-danger: #1A1614; --w-danger-text: #F66C6D; --w-danger-soft: #472020;
  --w-warn: #ECBD3A; --w-on-warn: #1A1614; --w-warn-text: #ECBD3A; --w-warn-soft: #382C0C;
  --w-shadow-raised: 0 1px 2px rgba(0, 0, 0, .40), 0 8px 24px rgba(0, 0, 0, .50);
  --w-shadow-float: 0 2px 6px rgba(0, 0, 0, .50), 0 12px 32px rgba(0, 0, 0, .60);
  --w-highlight: inset 0 1px 0 rgba(255, 255, 255, .06);
  --w-kbd: #2B2B2D; --w-key: #5A5A5E; --w-key-text: #F2F0EC; --w-key-alt: #3F3F42;
  --w-bar-text: #F2F0EC;
  color-scheme: dark;
}

/* App tints. Fill is the same in both schemes; text and soft change. */
.tint-red { --t-fill: #CA322E; --t-on: #FFFFFF; --t-text: #C52C2A; }
.tint-pink { --t-fill: #C63170; --t-on: #FFFFFF; --t-text: #C02B6C; }
.tint-grape { --t-fill: #A03FA7; --t-on: #FFFFFF; --t-text: #A03FA7; }
.tint-violet { --t-fill: #764EC7; --t-on: #FFFFFF; --t-text: #764EC7; }
.tint-indigo { --t-fill: #4B53C2; --t-on: #FFFFFF; --t-text: #4B53C2; }
.tint-blue { --t-fill: #136ED0; --t-on: #FFFFFF; --t-text: #096ACB; }
.tint-sky { --t-fill: #007EB0; --t-on: #FFFFFF; --t-text: #01729F; }
.tint-teal { --t-fill: #00807B; --t-on: #FFFFFF; --t-text: #007671; }
.tint-green { --t-fill: #278445; --t-on: #FFFFFF; --t-text: #217B3E; }
.tint-lime { --t-fill: #A8E051; --t-on: #1A1614; --t-text: #507308; }
.tint-yellow { --t-fill: #F8CC2F; --t-on: #1A1614; --t-text: #866300; }
.tint-cocoa { --t-fill: #846047; --t-on: #FFFFFF; --t-text: #846047; }
.tint-graphite { --t-fill: #51565B; --t-on: #FFFFFF; --t-text: #51565B; }
.phone[data-scheme="dark"] .tint-red, .phone[data-scheme="dark"].tint-red { --t-text: #F97770; }
.phone[data-scheme="dark"] .tint-pink, .phone[data-scheme="dark"].tint-pink { --t-text: #F57FA7; }
.phone[data-scheme="dark"] .tint-grape, .phone[data-scheme="dark"].tint-grape { --t-text: #D78ADB; }
.phone[data-scheme="dark"] .tint-violet, .phone[data-scheme="dark"].tint-violet { --t-text: #B199F4; }
.phone[data-scheme="dark"] .tint-indigo, .phone[data-scheme="dark"].tint-indigo { --t-text: #95A4F6; }
.phone[data-scheme="dark"] .tint-blue, .phone[data-scheme="dark"].tint-blue { --t-text: #67B0F9; }
.phone[data-scheme="dark"] .tint-sky, .phone[data-scheme="dark"].tint-sky { --t-text: #61C1ED; }
.phone[data-scheme="dark"] .tint-teal, .phone[data-scheme="dark"].tint-teal { --t-text: #55CEC0; }
.phone[data-scheme="dark"] .tint-green, .phone[data-scheme="dark"].tint-green { --t-text: #6CCD83; }
.phone[data-scheme="dark"] .tint-lime, .phone[data-scheme="dark"].tint-lime { --t-text: #AADF5B; }
.phone[data-scheme="dark"] .tint-yellow, .phone[data-scheme="dark"].tint-yellow { --t-text: #F4CD4B; }
.phone[data-scheme="dark"] .tint-cocoa, .phone[data-scheme="dark"].tint-cocoa { --t-text: #CEA98B; }
.phone[data-scheme="dark"] .tint-graphite, .phone[data-scheme="dark"].tint-graphite { --t-text: #ACB2B7; }
[class*="tint-"] { --t-soft: color-mix(in oklab, var(--t-fill) 15%, var(--w-surface)); }

/* ── Frame ─────────────────────────────────────────────────────────────── */
.phone {
  position: relative; width: var(--pw, 390px); height: var(--ph, 844px); overflow: hidden;
  background: var(--w-bg); color: var(--w-text);
  border-radius: 54px; box-sizing: border-box;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
  font-size: 17px; line-height: 24px; text-rendering: optimizeLegibility;
}
.phone[data-platform="android"] { border-radius: 40px; }
:where(.phone) *, :where(.phone) *::before, :where(.phone) *::after { box-sizing: border-box; }
.phone[data-platform="ios"] { font-family: -apple-system, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif; }
.phone[data-platform="android"] { font-family: Roboto, "Roboto Flex", system-ui, Arial, sans-serif; }
:where(.phone) svg { display: block; }
:where(.phone) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.w-statusbar { position: absolute; left: 0; right: 0; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; color: var(--w-bar-text); pointer-events: none; }
.phone[data-platform="ios"] .w-statusbar { height: 54px; padding: 0 34px 0 48px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
.phone[data-platform="android"] .w-statusbar { height: 40px; padding: 0 24px; font-size: 14px; font-weight: 500; letter-spacing: 0.01em; }
.w-statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.w-statusbar.on-dark { color: #FFFFFF; }
.phone.on-dark .w-homebar { background: #FFFFFF; }
.w-island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: var(--w-island); border-radius: 20px; z-index: 31; }
.w-punch { position: absolute; top: 12px; left: 50%; width: 16px; height: 16px; margin-left: -8px; background: #000; border-radius: 50%; z-index: 31; }
.w-homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--w-text); opacity: .9; z-index: 40; }
.phone[data-platform="android"] .w-homebar { width: 108px; height: 4px; margin-left: -54px; bottom: 10px; opacity: .75; }

.w-screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--w-bg); }
.w-scroll { flex: 1; overflow: hidden; position: relative; }
.w-pad { padding-left: var(--w-gutter); padding-right: var(--w-gutter); }
.w-top-ios { height: 54px; flex: none; }
.w-top-android { height: 40px; flex: none; }

/* ── Type ──────────────────────────────────────────────────────────────── */
.t-display { font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-large { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.016em; text-wrap: balance; }
.t-title1 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.012em; text-wrap: balance; }
.t-title2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.008em; text-wrap: balance; }
.t-title3 { font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -0.004em; }
.t-headline { font-size: 17px; line-height: 22px; font-weight: 600; }
.t-body { font-size: 17px; line-height: 24px; font-weight: 400; }
.t-callout { font-size: 15px; line-height: 20px; font-weight: 400; letter-spacing: 0.004em; }
.t-footnote { font-size: 13px; line-height: 18px; font-weight: 400; letter-spacing: 0.008em; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.012em; }
.t-sec { color: var(--w-text2); }
.t-ter { color: var(--w-text3); }
.t-ember { color: var(--w-ember-text); }
.t-danger { color: var(--w-danger-text); }
.t-pos { color: var(--w-pos-text); }
.t-warn { color: var(--w-warn-text); }
.t-tint { color: var(--t-text); }
.t-semibold { font-weight: 600; }
.t-num { font-variant-numeric: tabular-nums; }
.t-quote { font-style: italic; }

// Whim mockups: HTML helpers for the phone frames. Every helper returns a string.
// c = { p: 'ios' | 'android', s: 'light' | 'dark' } describes the frame being drawn.

const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function icon(name, size = 20, stroke = 2, extra = '') {
  const body = ICONS[name];
  if (!body) return '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
}

// Superellipse (n = 5) on a 100 box: the tile shape on both platforms.
const SQUIRCLE = (() => {
  const n = 5, pts = [];
  for (let i = 0; i < 96; i++) {
    const t = (i / 96) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    const x = 50 + 50 * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const y = 50 + 50 * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(`${x.toFixed(2)},${y.toFixed(2)}`);
  }
  return 'M' + pts.join('L') + 'Z';
})();

// ── The wisp ────────────────────────────────────────────────────────────────
const WISP_PATH = 'M28 4C35.7 4 42 10.3 42 18C42 25.5 36.5 31 30 32.6C24.5 34 21 36.6 18.2 40.2C15.8 43.3 12.5 45.6 8.6 45.2C6.2 45 4.6 43.4 5.6 42.1C9.6 41.8 12.6 39.2 13.9 35.5C15.1 32 14.3 28.7 14.1 25.5C14 23 14 20.5 14 18C14 10.3 20.3 4 28 4Z';

const WISP_DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="wg-body" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#FFD98A"/><stop offset=".38" stop-color="#FFB54F"/><stop offset=".72" stop-color="#FF8A2B"/><stop offset="1" stop-color="#F0561A"/></radialGradient>
<radialGradient id="wg-dim" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#E9B98C"/><stop offset=".6" stop-color="#C9895A"/><stop offset="1" stop-color="#9C5E3C"/></radialGradient>
<radialGradient id="wg-halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF9127" stop-opacity=".75"/><stop offset=".55" stop-color="#FF9127" stop-opacity=".22"/><stop offset="1" stop-color="#FF9127" stop-opacity="0"/></radialGradient>
</defs></svg>`;

const POSES = {
  listening: { ex: 0, ey: 0, ry: 3.5, rot: 0, ty: 0, glow: .85, eyes: 'open' },
  thinking: { ex: 1.6, ey: -1.7, ry: 3.4, rot: -6, ty: 0, glow: .8, eyes: 'open' },
  making: { ex: -.4, ey: 1.7, ry: 3.0, rot: 4, ty: 0, glow: 1, eyes: 'open' },
  stuck: { ex: 0, ey: .8, ry: 1.3, rot: 0, ty: 1, glow: .35, eyes: 'open', dim: true },
  failed: { ex: 0, ey: 1.8, ry: 1.7, rot: 7, ty: 1.6, glow: .3, eyes: 'open', dim: true },
  done: { ex: 0, ey: -.4, ry: 3.4, rot: 0, ty: -1, glow: 1, eyes: 'arc' },
  asleep: { ex: 0, ey: .6, ry: 3.4, rot: 0, ty: .6, glow: .45, eyes: 'closed' },
};

function wispEyes(pose) {
  const p = POSES[pose] || POSES.listening;
  const L = 23.6 + p.ex, R = 32.4 + p.ex, Y = 17.6 + p.ey;
  if (p.eyes === 'arc') {
    return `<path d="M${L - 2.5} ${Y + .8}Q${L} ${Y - 2.6} ${L + 2.5} ${Y + .8}M${R - 2.5} ${Y + .8}Q${R} ${Y - 2.6} ${R + 2.5} ${Y + .8}" fill="none" stroke="#1A1614" stroke-width="1.7" stroke-linecap="round"/>`;
  }
  if (p.eyes === 'closed') {
    return `<path d="M${L - 2.3} ${Y}Q${L} ${Y + 1.6} ${L + 2.3} ${Y}M${R - 2.3} ${Y}Q${R} ${Y + 1.6} ${R + 2.3} ${Y}" fill="none" stroke="#1A1614" stroke-width="1.5" stroke-linecap="round"/>`;
  }
  const hl = p.ry > 2 ? `<circle cx="${L + .8}" cy="${Y - 1.3}" r=".85" fill="#fff"/><circle cx="${R + .8}" cy="${Y - 1.3}" r=".85" fill="#fff"/>` : '';
  return `<ellipse cx="${L}" cy="${Y}" rx="2.4" ry="${p.ry}" fill="#1A1614"/><ellipse cx="${R}" cy="${Y}" rx="2.4" ry="${p.ry}" fill="#1A1614"/>${hl}`;
}

// size in px. eyes are drawn at 48px and above unless forced off. mode: 'glow' | 'grey'.
function wisp({ size = 96, pose = 'listening', activity = .7, eyes, mode = 'glow', cls = '' } = {}) {
  const p = POSES[pose] || POSES.listening;
  const showEyes = eyes !== undefined ? eyes : size >= 48;
  const grey = mode === 'grey';
  const glow = grey ? 0 : Math.min(1, p.glow * (.55 + .45 * activity));
  const fill = grey ? 'style="fill:var(--w-text3)"' : `fill="url(#${p.dim ? 'wg-dim' : 'wg-body'})"`;
  const halo = glow > 0 ? `<circle cx="27" cy="21" r="26" fill="url(#wg-halo)" opacity="${glow.toFixed(2)}"/>` : '';
  return `<span class="w-wisp ${cls}" style="width:${size}px;height:${size}px" data-pose="${pose}"><svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${halo}<g transform="translate(0 ${p.ty}) rotate(${p.rot} 28 22)"><path d="${WISP_PATH}" ${fill}/>${showEyes && !grey ? wispEyes(pose) : ''}</g></svg></span>`;
}

// ── Tiles ───────────────────────────────────────────────────────────────────
// app = { name, tint, icon, letter? }. state: ready | making | queued | failed | stopped | update | changing | change-failed
function tile(app, { size = 64, state = 'ready', activity = .8, label = true, second } = {}) {
  let inner = '';
  const glyph = Math.round(size * .5);
  const stroke = size >= 56 ? 2 : size >= 32 ? 2.1 : 2.3;
  if (state === 'making' || state === 'queued') {
    inner = `<svg class="sq" viewBox="0 0 100 100"><path d="${SQUIRCLE}" style="fill:var(--w-ember-soft)"/></svg><span class="glyph">${wisp({ size: Math.round(size * .56), pose: state === 'queued' ? 'asleep' : 'making', activity: state === 'queued' ? .25 : activity, eyes: false })}</span>`;
  } else if (state === 'failed' || state === 'stopped' || state === 'update') {
    inner = `<svg class="sq" viewBox="0 0 100 100"><path d="${SQUIRCLE}" style="fill:var(--w-fill)"/></svg><span class="glyph">${wisp({ size: Math.round(size * .5), mode: 'grey', eyes: false })}</span>${state === 'failed' ? `<span class="badge">${icon('circle-alert', 14, 2.4)}</span>` : ''}`;
  } else {
    const content = app.icon ? `<span class="glyph" style="color:var(--t-on)">${icon(app.icon, glyph, stroke)}</span>` : `<span class="glyph t-title2" style="color:var(--t-on)">${esc(app.name[0])}</span>`;
    inner = `${state === 'changing' ? '<span class="ring"></span>' : ''}<svg class="sq" viewBox="0 0 100 100"><path d="${SQUIRCLE}" style="fill:var(--t-fill)"/></svg>${content}${state === 'change-failed' ? `<span class="badge">${icon('circle-alert', 14, 2.4)}</span>` : ''}`;
  }
  const secondLine = {
    making: '<div class="st t-ember">Making…</div>', queued: '<div class="st t-sec">Waiting…</div>',
    failed: '<div class="st t-danger">Didn’t work</div>', stopped: '<div class="st t-sec">Stopped</div>',
    update: '<div class="st t-warn">Needs update</div>', changing: '<div class="st t-ember">Changing…</div>',
    'change-failed': '<div class="st t-danger">Change didn’t work</div>',
  }[state] || (second ? `<div class="st t-sec">${esc(second)}</div>` : '');
  const t = `<div class="w-tile tint-${app.tint || 'graphite'}" style="--tile:${size}px">${inner}</div>`;
  if (!label) return t;
  return `<div class="w-cell tint-${app.tint || 'graphite'}">${t}<div class="nm">${esc(app.name)}</div>${secondLine}</div>`;
}

// ── Frame pieces ────────────────────────────────────────────────────────────
function statusBar(c, { onDark = false } = {}) {
  if (c.p === 'ios') {

// Whim mockups: the six springs from 01-direction.md §9.2, a small interruptible spring driver,
// and the helpers the motion page uses (momentum projection, rubber band, CSS linear() sampling).

const SPRINGS = {
  instant: { response: 0.12, damping: 1.0, use: 'Press-in' },
  snappy: { response: 0.28, damping: 1.0, use: 'Press-out, toggles, selection' },
  smooth: { response: 0.40, damping: 1.0, use: 'Push, pop, sheets, steps' },
  fling: { response: 0.35, damping: 0.80, use: 'Released drags, with velocity' },
  morph: { response: 0.50, damping: 0.90, use: 'Tile to app, ghost to tile' },
  spark: { response: 0.55, damping: 0.55, use: 'Rare celebrations' },
};

function springConsts(cfg) {
  const w = (2 * Math.PI) / cfg.response;
  return { k: w * w, c: 2 * cfg.damping * w };
}

let REDUCED = false;
try { REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* no matchMedia */ }

// A value that springs toward a target. Retargeting keeps position and velocity, so motion never jumps.
class SpringValue {
  constructor(value, onUpdate, { precision = 0.001 } = {}) {
    this.x = value; this.v = 0; this.target = value; this.onUpdate = onUpdate; this.raf = 0;
    this.cfg = SPRINGS.smooth; this.precision = precision; this.onRest = null;
  }
  to(target, cfg = SPRINGS.smooth, velocity) {
    this.target = target; this.cfg = cfg;
    if (velocity !== undefined) this.v = velocity;
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.step(t)); }
  }
  set(x) { this.stop(); this.x = x; this.v = 0; this.target = x; this.onUpdate(x); }
  stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; }
  step(t) {
    const dt = Math.min((t - this.last) / 1000, 1 / 20); this.last = t;
    const { k, c } = springConsts(this.cfg);
    const n = Math.max(1, Math.ceil(dt * 480)), h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -k * (this.x - this.target) - c * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    this.onUpdate(this.x);
    if (Math.abs(this.x - this.target) < this.precision && Math.abs(this.v) < this.precision * 10) {
      this.x = this.target; this.v = 0; this.onUpdate(this.x); this.raf = 0;
      if (this.onRest) this.onRest();
      return;
    }
    this.raf = requestAnimationFrame((tt) => this.step(tt));
  }
}

// Apple's projection: where a flick of velocity v (px/s) comes to rest.
function project(v, d = 0.998) { return ((v / 1000) * d) / (1 - d); }
// Progressive resistance past a bound.
function rubberband(over, dim, c = 0.55) { return (over * dim * c) / (dim + c * Math.abs(over)); }

// Velocity tracker over the last ~80 ms of pointer samples.
class VelocityTracker {
  constructor() { this.s = []; }
  add(x, t = performance.now()) { this.s.push([x, t]); while (this.s.length > 2 && t - this.s[0][1] > 80) this.s.shift(); }
  velocity() { if (this.s.length < 2) return 0; const [x0, t0] = this.s[0], [x1, t1] = this.s[this.s.length - 1]; return t1 > t0 ? ((x1 - x0) / (t1 - t0)) * 1000 : 0; }
  reset() { this.s = []; }
}

// Step response sampled at 60 Hz until it settles: the curve a WAAPI `linear()` easing would carry.
function sampleSpring(cfg, { max = 2.5 } = {}) {
  const { k, c } = springConsts(cfg);
  let x = 0, v = 0, t = 0; const pts = [0]; const h = 1 / 960; let settle = 0;
  while (t < max) {
    for (let i = 0; i < 16; i++) { const a = -k * (x - 1) - c * v; v += a * h; x += v * h; }
    t += 1 / 60; pts.push(x);
    if (Math.abs(x - 1) < 0.001 && Math.abs(v) < 0.01) { settle = t; break; }
  }
  return { pts, duration: settle || max };
}
function linearEasing(cfg) {
  const { pts, duration } = sampleSpring(cfg);
  const step = Math.max(1, Math.floor(pts.length / 40));
  const kept = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  return { css: `linear(${kept.map((p) => +p.toFixed(3)).join(', ')})`, ms: Math.round(duration * 1000) };
}

function historyBody(c, { expanded = -1, currentIndex = 0 } = {}) {
  const versions = [
    { v: 4, when: '2 days ago', kind: ['plus', 'Added'], said: 'Add a chime when each step ends', sum: 'Plays a short chime at the end of every step.' },
    { v: 3, when: '5 days ago', kind: ['pencil', 'Changed'], said: 'Let me pick V60 or Chemex', sum: 'Adds a brewer choice; each has its own pours.' },
    { v: 2, when: 'Sep 30', kind: ['palette', 'Look'], said: 'Make the countdown bigger', sum: 'The countdown fills the top half of the screen.' },
    { v: 1, when: 'Sep 28', kind: ['flag', 'Start'], said: 'A timer for my pour-over recipe', sum: 'Where this app began.' },
  ];
  const rows = versions.map((x, i) => {
    const cur = i === currentIndex;
    const actions = i === expanded ? `<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${cur ? btn('Change it', 'ember', { size: 'md', block: false }) : btn('Go back to this version', 'secondary', { size: 'md', block: false }) + btn('Make a copy', 'plain', { size: 'md', block: false })}</div>` : '';

const dims = (p) => (p === 'ios' ? { W: 390, H: 844 } : { W: 412, H: 915 });
function frameHTML(screen, c, scale) {
  const { W, H } = dims(c.p);
  return `<div class="fw" style="width:${Math.round(W * scale)}px;height:${Math.round(H * scale)}px"><div style="transform:scale(${scale});transform-origin:top left;width:${W}px;height:${H}px;border-radius:${c.p === 'ios' ? 54 : 40}px">${screen.render(c)}</div></div>`;
}
const schemes = () => (PG.scheme === 'both' ? ['light', 'dark'] : [PG.scheme]);
const contentWidth = () => Math.min(1320, document.documentElement.clientWidth) - 40;

// ── Overview ────────────────────────────────────────────────────────────────
function viewOverview() {

  const story = (title, sub, steps) => {
    const nf = steps.length, sc = narrow ? Math.min(.42, (cw - 20) / (2 * W)) : Math.min(.36, (cw - 44 - (nf - 1) * 96) / (nf * W));

    return `<div class="pg-story"><h3>${esc(title)}</h3><p>${esc(sub)}</p><div class="pg-storyrow">${items}</div></div>`;
  };
  const flows = `<section class="pg-section"><h2>The two flows</h2><p class="sub">Making an app and changing one, frame by frame. The labels name the motion between frames (05-motion.md).</p>
${story('Make an app', 'From the composer to the running app: four taps, one sheet, the wisp at work in the middle.', [['home', ''], ['describe', 'M6 the composer grows into the sheet'], ['plan', 'M7 push; questions land first'], ['making', 'M9 the wisp moves to the centre'], ['ready', 'M10 flare, the tile rises out of it'], ['app-timer', 'M2 the app grows out of its tile']])}

  const groups = GROUPS.map((g) => {
    const cards = SCREENS.filter((s) => s.group === g).map((s) => `<article class="pg-card" style="--note-w:${Math.round(W * scale * n + (n - 1) * 12)}px"><h3><a href="#s-${s.id}">${esc(s.title)}</a></h3><a href="#s-${s.id}" aria-label="Open ${esc(s.title)}" class="pg-frames" style="text-decoration:none">${schemes().map((sc) => frameHTML(s, { p: PG.platform, s: sc }, scale)).join('')}</a><p>${esc(s.note)}</p></article>`).join('');

  return hero + flows + groups;
}

function viewScreen(id) {
  const i = SCREENS.findIndex((s) => s.id === id);
  if (i < 0) return viewOverview();
  const s = SCREENS[i], prev = SCREENS[(i - 1 + SCREENS.length) % SCREENS.length], next = SCREENS[(i + 1) % SCREENS.length];
  const variants = [['ios', 'light', 'iPhone · light'], ['ios', 'dark', 'iPhone · dark'], ['android', 'light', 'Android · light'], ['android', 'dark', 'Android · dark']];
  const cw = contentWidth(), scale = cw < 720 ? Math.min(.8, cw / 412) : .8;

}

// ── Motion wiring ───────────────────────────────────────────────────────────
function cssColor(name, el) { return getComputedStyle(el || document.documentElement).getPropertyValue(name).trim(); }

function wireMotion(root) {
  const rmBtn = root.querySelector('#rm-toggle');
  const setRM = (on) => { REDUCED = on; rmBtn.textContent = `Reduce Motion: ${on ? 'on' : 'off'}`; rmBtn.setAttribute('aria-pressed', String(on)); };
  setRM(REDUCED);
  rmBtn.addEventListener('click', () => setRM(!REDUCED));

  // Spring curves and tracks
  const accent = cssColor('--pg-accent'), line = cssColor('--pg-line'), text2 = cssColor('--pg-text2');
  root.querySelectorAll('canvas[data-spring]').forEach((cv) => {
    const s = SPRINGS[cv.dataset.spring], ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    const { k, c } = springConsts(s); let x = 0, v = 0; const pts = [];
    for (let i = 0; i <= 240; i++) { for (let j = 0; j < 8; j++) { const a = -k * (x - 1) - c * v; v += a * (1.2 / 240 / 8); x += v * (1.2 / 240 / 8); } pts.push(x); }
    const y = (val) => H - 14 - val * (H - 40);
    ctx.clearRect(0, 0, W, H); ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(0, y(1)); ctx.lineTo(W, y(1)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = accent; ctx.lineWidth = 4; ctx.beginPath(); pts.forEach((p, i) => { const px = (i / 240) * W; if (i) ctx.lineTo(px, y(p)); else ctx.moveTo(px, y(p)); }); ctx.stroke();
    ctx.fillStyle = text2; ctx.font = '20px system-ui'; ctx.fillText('1.2 s', W - 52, H - 2);
  });
  root.querySelectorAll('[data-track]').forEach((tr) => {
    const ball = tr.querySelector('.ball'), cfg = SPRINGS[tr.dataset.track];
    const span = () => tr.clientWidth - 28;
    const sv = new SpringValue(0, (p) => { ball.style.transform = `translateX(${p * span()}px)`; });
    const go = () => { if (REDUCED) { sv.set(sv.target > .5 ? 0 : 1); return; } sv.to(sv.target > .5 ? 0 : 1, cfg); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });

  // Press
  root.querySelectorAll('.pg-demo .w-btn, [data-press-tiles] .w-tile').forEach((el) => {
    const sv = new SpringValue(1, (s) => { if (REDUCED) { el.style.transform = ''; el.style.opacity = String(1 - (1 - s) * 10 * .3); } else { el.style.transform = `scale(${s})`; el.style.opacity = ''; } });
    const target = el.classList.contains('w-tile') ? .96 : .97;
    let down = false;
    el.addEventListener('pointerdown', () => { down = true; sv.to(target, SPRINGS.instant); });
    const up = () => { if (!down) return; down = false; sv.to(1, SPRINGS.snappy); };
    el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
  });

  // Sheet
  const sd = root.querySelector('[data-sheet-demo]');
  if (sd) {
    const sheet = sd.querySelector('.w-sheet'), scrim = sd.querySelector('.w-scrim'), H = 330;
    const apply = (y) => { if (REDUCED && !dragging) { sheet.style.transform = `translateY(${y > H / 2 ? H + 20 : 0}px)`; sheet.style.opacity = String(Math.max(0, 1 - y / H)); } else { sheet.style.transform = `translateY(${y}px)`; sheet.style.opacity = ''; } scrim.style.opacity = String(Math.max(0, Math.min(1, 1 - y / H))); };
    let dragging = false, startY = 0, startPos = 0; const vt = new VelocityTracker();
    const sv = new SpringValue(0, apply, { precision: .3 });
    sheet.addEventListener('pointerdown', (e) => { dragging = true; sv.stop(); startY = e.clientY; startPos = sv.x; vt.reset(); vt.add(e.clientY); sheet.setPointerCapture(e.pointerId); sheet.style.cursor = 'grabbing'; });
    sheet.addEventListener('pointermove', (e) => { if (!dragging) return; let y = startPos + (e.clientY - startY); if (y < 0) y = rubberband(y, H); sv.x = y; apply(y); vt.add(e.clientY); });
    const release = () => {
      if (!dragging) return; dragging = false; sheet.style.cursor = 'grab';
      const v = vt.velocity(), end = sv.x + project(v), close = end > H / 2;
      if (REDUCED) { sv.set(close ? H + 20 : 0); return; }
      sv.to(close ? H + 20 : 0, SPRINGS.fling, v);
    };
    sheet.addEventListener('pointerup', release); sheet.addEventListener('pointercancel', release);
    sd.querySelector('.w-btn').addEventListener('click', () => { if (REDUCED) sv.set(0); else sv.to(0, SPRINGS.smooth); });
  }

  // Morph: tile to app and back
  const md = root.querySelector('[data-morph-demo]');
  if (md) {
    const layer = md.querySelector('.morph-layer'), bg = layer.querySelector('.ml-bg'), gl = layer.querySelector('.ml-glyph'), appC = layer.querySelector('.ml-app');
    let from = null, opening = false; const SW = 320, SH = 560;
    const draw = (p) => {
      if (!from) return;
      if (REDUCED) { layer.style.transform = ''; layer.style.borderRadius = '32px'; layer.style.opacity = String(Math.min(1, p)); gl.style.opacity = '0'; appC.style.opacity = String(p); return; }
      layer.style.opacity = '1';
      const x = from.x * (1 - p), yy = from.y * (1 - p), w = from.w + (SW - from.w) * p, h = from.h + (SH - from.h) * p;
      const sx = w / SW, sy = h / SH, r = from.w * .225 * (1 - p) + 32 * p;
      layer.style.transform = `translate(${x}px,${yy}px) scale(${sx},${sy})`;
      layer.style.borderRadius = `${r / sx}px / ${r / sy}px`;
      gl.style.transform = `scale(${(from.w / SW) / sx * (1 + p * .4)},${(from.w / SW) / sx * (1 + p * .4) * (sx / sy)})`;
      gl.style.opacity = String(Math.max(0, 1 - p * 1.4));
      appC.style.opacity = String(Math.max(0, (p - .75) / .25));
      appC.style.transform = `scale(${1 / sx},${1 / sy})`; appC.style.transformOrigin = 'top left';
    };
    const sv = new SpringValue(0, draw, { precision: .002 });
    sv.onRest = () => { if (sv.x === 0) { layer.style.display = 'none'; md.querySelectorAll('.w-tile').forEach((t) => { t.style.visibility = ''; }); } };
    md.querySelectorAll('.w-cell').forEach((cell) => cell.addEventListener('click', () => {
      const t = cell.querySelector('.w-tile'), r = t.getBoundingClientRect(), base = md.getBoundingClientRect();
      const k = base.width / SW;
      from = { x: (r.left - base.left) / k, y: (r.top - base.top) / k, w: r.width / k, h: r.height / k };
      const tint = [...cell.classList].find((cl) => cl.startsWith('tint-'));
      layer.className = `morph-layer ${tint}`; bg.style.background = 'var(--t-fill)';
      gl.innerHTML = t.querySelector('.glyph').innerHTML; gl.style.color = 'var(--t-on)';
      appC.querySelector('.t-title1').textContent = cell.querySelector('.nm').textContent;
      md.querySelectorAll('.w-tile').forEach((tt) => { tt.style.visibility = ''; }); t.style.visibility = 'hidden';
      layer.style.display = 'block'; layer.style.transformOrigin = 'top left'; opening = true;
      if (REDUCED) { sv.set(0); sv.to(1, { response: .16, damping: 1 }); return; }
      sv.set(0); sv.to(1, SPRINGS.morph);
    }));
    layer.addEventListener('click', () => { opening = !opening; const target = opening ? 1 : 0; if (REDUCED) { sv.to(target, { response: .16, damping: 1 }); return; } sv.to(target, opening ? SPRINGS.morph : SPRINGS.smooth); });
  }

  // Ghost to tile
  const tm = root.querySelector('[data-transmute]');
  if (tm) {
    const holder = tm.querySelector('.tm-tile');
    const build = () => {
      holder.innerHTML = `<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="${SQUIRCLE}" style="fill:var(--w-ember-soft)"/></svg><div class="tm-fill tint-cocoa" style="position:absolute;inset:0;clip-path:circle(0% at 50% 50%)"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="${SQUIRCLE}" style="fill:var(--t-fill)"/></svg><div class="tm-glyph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t-on);opacity:0">${icon('timer', 48, 2)}</div></div><div class="tm-ember" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${wisp({ size: 54, pose: 'making', eyes: false, activity: 1 })}</div>`;
    };
    build();
    const fill = () => holder.querySelector('.tm-fill'), glyph = () => holder.querySelector('.tm-glyph'), ember = () => holder.querySelector('.tm-ember');
    const m = new SpringValue(0, (p) => { fill().style.clipPath = `circle(${(p * 72).toFixed(1)}% at 50% 50%)`; glyph().style.opacity = String(p); glyph().style.transform = `scale(${.9 + .1 * p})`; ember().style.opacity = String(1 - p); });
    const g = new SpringValue(1, (s) => { ember().style.transform = `scale(${s})`; });
    const [deliver, reset] = tm.querySelectorAll('.w-btn');
    deliver.addEventListener('click', () => {
      if (REDUCED) { m.set(1); return; }
      g.set(1); g.to(1.35, SPRINGS.spark); setTimeout(() => { g.to(1, SPRINGS.spark); m.to(1, SPRINGS.morph); }, 140);
    });
    reset.addEventListener('click', () => { m.stop(); g.stop(); build(); m.set(0); g.set(1); });
  }

  // Honest light
  const hl = root.querySelector('[data-honest]');
  if (hl) {
    const holder = hl.querySelector('.hl-wisp'), line = hl.querySelector('.hl-line'), rate = root.querySelector('#hl-rate'), stallBtn = root.querySelector('#hl-stall');
    let pose = 'making', stalled = false, last = performance.now(), lastArrival = performance.now(), flick = 0, alive = true;
    const render = () => { holder.innerHTML = wisp({ size: 140, pose, activity: 1 }); };
    render();
    const act = new SpringValue(.6, () => {}, { precision: .0005 }); act.cfg = { response: .6, damping: 1 };
    stallBtn.addEventListener('click', () => { stalled = !stalled; stallBtn.textContent = stalled ? 'Resume the stream' : 'Stall the stream'; });
    const tick = (t) => {
      if (!alive || !holder.isConnected) return;
      const dt = (t - last) / 1000; last = t;
      const r = stalled ? 0 : +rate.value;
      if (Math.random() < r * dt) { lastArrival = t; flick += .07 * act.x; }
      flick *= Math.exp(-dt / .12);
      const since = (t - lastArrival) / 1000;
      const targetA = stalled && since > 2 ? .15 : Math.min(1, r / 40);
      act.to(targetA, { response: .6, damping: 1 });
      const newPose = stalled && since > 2 ? 'stuck' : r === 0 ? 'listening' : 'making';
      if (newPose !== pose) { pose = newPose; render(); line.textContent = pose === 'stuck' ? 'No word from the server for 40 s. Still waiting.' : 'Usually about a minute.'; }
      const I = Math.min(1.15, .55 + .45 * act.x + (REDUCED ? 0 : flick));
      const halo = holder.querySelector('circle'); const body = holder.querySelector('g');
      if (halo) { halo.setAttribute('opacity', String((pose === 'stuck' ? .25 : .9) * I)); halo.setAttribute('r', String(22 + 6 * I)); }
      if (body) body.style.filter = `brightness(${(.82 + .22 * I).toFixed(3)})`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Controls
  const ctl = root.querySelector('[data-controls]');
  if (ctl) {
    const sw = ctl.querySelector('.s-switch'); let on = false;
    sw.style.setProperty('position', 'relative');
    const knobSv = new SpringValue(0, (p) => { sw.style.setProperty('--k', p); sw.classList.toggle('on', p > .5); });
    sw.style.cssText += ';';
    const styleKnob = document.createElement('style');
    styleKnob.textContent = '[data-controls] .s-switch::after{left:calc(2px + var(--k,0) * 20px)!important}';
    ctl.appendChild(styleKnob);
    ctl.querySelector('[data-switch]').addEventListener('click', () => { on = !on; if (REDUCED) knobSv.set(on ? 1 : 0); else knobSv.to(on ? 1 : 0, SPRINGS.snappy); sw.classList.toggle('on', on); });
    const seg = ctl.querySelector('[data-seg]'), thumb = seg.querySelector('.thumb'), opts = [...seg.querySelectorAll('span')];
    const segW = () => (seg.clientWidth - 4) / 3;
    const segSv = new SpringValue(1, (i) => { thumb.style.width = `${segW()}px`; thumb.style.transform = `translateX(${i * segW()}px)`; });
    segSv.set(1);
    opts.forEach((o, i) => o.addEventListener('click', () => { if (REDUCED) segSv.set(i); else segSv.to(i, SPRINGS.snappy); }));
    ctl.querySelectorAll('[data-chips] .w-chip').forEach((ch) => ch.addEventListener('click', () => {
      ctl.querySelectorAll('[data-chips] .w-chip').forEach((x) => { x.classList.remove('sel'); x.innerHTML = x.textContent; });
      ch.classList.add('sel'); ch.innerHTML = icon('check', 16, 2.6) + ch.textContent;
    }));
    const val = ctl.querySelector('[data-val]'); let n = 5;
    ctl.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
      const d = +b.dataset.step; if (n + d < 0) return; n += d;
      if (REDUCED) { val.textContent = String(n); return; }
      const out = document.createElement('span'); out.textContent = val.textContent; out.style.cssText = 'position:absolute;left:0;right:0;top:0';
      val.textContent = String(n); val.appendChild(out);
      const p = new SpringValue(0, (x) => { out.style.transform = `translateY(${-d * 14 * x}px)`; out.style.opacity = String(1 - x); val.firstChild.parentElement.style.setProperty('--y', String(d * 14 * (1 - x))); });
      p.onRest = () => out.remove(); p.to(1, SPRINGS.snappy);
    }));
  }

  // Back swipe
  const swd = root.querySelector('[data-swipe]');
  if (swd) {
    const topEl = swd.querySelector('.sw-top'), under = swd.querySelector('.sw-under'), dim = swd.querySelector('.sw-dim'), again = swd.querySelector('.sw-again');
    const W = 320; let dragging = false, sx = 0, start = 0; const vt = new VelocityTracker();
    const apply = (x) => { const p = Math.min(1, Math.max(0, x / W)); topEl.style.transform = `translateX(${x}px)`; under.style.transform = `translateX(${-.3 * W * (1 - p)}px)`; dim.style.opacity = String(.12 * (1 - p)); };
    const sv = new SpringValue(0, apply, { precision: .3 });
    apply(0);
    topEl.addEventListener('pointerdown', (e) => { const r = topEl.getBoundingClientRect(); if (e.clientX - r.left > 28 && sv.x === 0) return; dragging = true; sv.stop(); sx = e.clientX; start = sv.x; vt.reset(); vt.add(e.clientX); topEl.setPointerCapture(e.pointerId); });
    topEl.addEventListener('pointermove', (e) => { if (!dragging) return; const x = Math.max(0, start + e.clientX - sx); sv.x = x; apply(x); vt.add(e.clientX); });
    const rel = () => {
      if (!dragging) return; dragging = false;
      const v = vt.velocity(), end = sv.x + project(v), commit = end > W / 2 || v > 500;
      if (REDUCED) { sv.set(commit ? W : 0); }
      else sv.to(commit ? W : 0, SPRINGS.fling, v);
      again.style.display = commit ? 'block' : 'none';
    };
    topEl.addEventListener('pointerup', rel); topEl.addEventListener('pointercancel', rel);
    swd.addEventListener('click', (e) => { if (e.target.closest('.sw-again') || (sv.target === W && e.target.closest('.sw-under'))) { if (REDUCED) sv.set(0); else sv.to(0, SPRINGS.smooth); again.style.display = 'none'; } });
  }
}


// ── Prototype ───────────────────────────────────────────────────────────────
const PROTO = {
  home: [['.w-composer', 'describe', 'sheet', 'Make an app'], ['.w-cell:first-child', 'app-timer', 'morph', 'Open Pour Timer']],
  describe: [['.w-btn.ember', 'plan-thinking', 'push', 'Continue']],
  'plan-thinking': [['@auto', 'plan', 'fade', 1500]],
  plan: [['.w-btn.ember', 'making', 'fade', 'Make it']],
  making: [['@auto', 'ready', 'fade', 3200], ['.w-btn.secondary', 'home-states', 'down', 'Back to your apps']],
  ready: [['.w-btn.tint', 'app-timer', 'morph', 'Open Pour Timer'], ['.w-actions .w-btn.plain', 'home', 'down', 'Done']],
  'home-states': [['.w-composer', 'describe', 'sheet', 'Make an app'], ['.w-cell:first-child', 'making', 'sheet', 'Show progress']],
  'app-timer': [['.w-orb', 'whim-sheet', 'sheet', 'Whim menu']],
  'whim-sheet': [['.w-field', 'whim-plan', 'sheet', 'What should change?'], ['.w-row:last-child', 'home', 'down', 'Your apps']],
  'whim-plan': [['.w-btn.ember', 'app-changing', 'down', 'Make the change']],
  'app-changing': [['.w-toast .ta', 'app-timer', 'fade', 'Reload']],
};
let protoTimer = 0;
function viewPrototype() {
  return `<div class="pg-focus-head"><div><div class="pg-flabel">Prototype</div><h2>Tap through it</h2><p>Make an app, open it, then change it while it runs. Highlighted areas are tappable; transitions use the system’s springs. The motion lab has the full gestures.</p></div><div class="pg-row"><button class="pg-btn dark" id="proto-restart">Start over</button></div></div>
<div class="pg-proto"><div class="pg-proto-stage" id="proto-stage"></div><ol class="pg-proto-steps" id="proto-steps"><li>Tap <b>Make an app…</b></li><li><b>Continue</b>, then answer or skip the choices</li><li><b>Make it</b> and watch the wisp work</li><li><b>Open Pour Timer</b></li><li>Tap the ember in the corner, then <b>What should change?</b></li><li><b>Make the change</b>, then <b>Reload</b></li></ol></div>`;
}
function wireProto(root) {
  const stage = root.querySelector('#proto-stage');
  const { W, H } = dims(PG.platform);
  const sc = Math.min(1, (Math.min(contentWidth(), 520)) / W);
  stage.style.width = `${Math.round(W * sc)}px`; stage.style.height = `${Math.round(H * sc)}px`;
  const scheme = PG.scheme === 'dark' ? 'dark' : 'light';
  const ease = linearEasing(SPRINGS.smooth), easeM = linearEasing(SPRINGS.morph);
  const show = (id, how) => {
    clearTimeout(protoTimer);
    const s = SCREENS.find((x) => x.id === id);
    const layer = document.createElement('div');
    layer.className = 'pg-proto-layer';
    layer.style.transform = `scale(${sc})`;
    layer.innerHTML = s.render({ p: PG.platform, s: scheme });
    stage.appendChild(layer);
    const old = [...stage.children].filter((c) => c !== layer);
    const frames = { sheet: [{ transform: `translateY(60px) scale(${sc})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], push: [{ transform: `translateX(48px) scale(${sc})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], down: [{ transform: `scale(${sc * 1.03})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], morph: [{ transform: `scale(${sc * .9})`, opacity: 0 }, { transform: `scale(${sc})`, opacity: 1 }], fade: [{ opacity: 0 }, { opacity: 1 }] }[how || 'fade'];
    const reduced = REDUCED;
    const anim = layer.animate(reduced ? [{ opacity: 0 }, { opacity: 1 }] : frames, reduced ? { duration: 160, easing: 'ease-out' } : { duration: how === 'morph' ? easeM.ms : ease.ms, easing: how === 'morph' ? easeM.css : ease.css });
    anim.onfinish = () => old.forEach((o) => o.remove());
    const hops = PROTO[id] || [];
    hops.forEach(([sel, next, kind, extra]) => {
      if (sel === '@auto') { protoTimer = setTimeout(() => { if (stage.isConnected) show(next, kind); }, extra); return; }
      const el = layer.querySelector(sel);
      if (!el) return;
      el.classList.add('proto-hot'); el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); el.setAttribute('aria-label', extra);
      const go = (e) => { e.stopPropagation(); show(next, kind); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
    });
  };
  show('home', 'fade');
  root.querySelector('#proto-restart').addEventListener('click', () => show('home', 'fade'));
}

// ── Shell ───────────────────────────────────────────────────────────────────
function navHTML(route) {
  const link = (h, label) => `<a href="#${h}" class="${(route === h || (h === '' && (route === '' || route.startsWith('s-')))) ? 'on' : ''}">${label}</a>`;
  const seg = (key, opts) => `<div class="pg-seg" role="group" aria-label="${key}">${opts.map(([v, l]) => `<button data-${key}="${v}" class="${PG[key] === v ? 'on' : ''}" aria-pressed="${PG[key] === v}">${l}</button>`).join('')}</div>`;
  return `<div class="pg-bar-in"><a class="pg-brand" href="#">${wispMini()}Whim · system v1</a><nav class="pg-nav">${link('', 'Screens')}${link('components', 'Components')}${link('tokens', 'Tokens')}${link('motion', 'Motion')}${link('prototype', 'Prototype')}</nav><div class="pg-tools">${seg('platform', [['ios', 'iPhone'], ['android', 'Android']])}${seg('scheme', [['both', 'Both'], ['light', 'Light'], ['dark', 'Dark']])}</div></div>`;
}
function wispMini() { return `<span class="phone" data-scheme="light" data-platform="ios" style="--pw:26px;--ph:26px;border-radius:0;background:none;display:inline-flex;overflow:visible">${wisp({ size: 26, eyes: false, activity: .8 })}</span>`; }

function render() {
  const route = (location.hash || '').replace(/^#/, '');
  document.getElementById('pg-bar').innerHTML = navHTML(route);
  let html;
  if (route.startsWith('s-')) html = viewScreen(route.slice(2));
  else if (route === 'components') html = viewComponents();
  else if (route === 'tokens') html = viewTokens();
  else if (route === 'motion') html = viewMotion();
  else if (route === 'prototype') html = viewPrototype();
  else html = viewOverview();
  const main = document.getElementById('pg-main');
  main.innerHTML = html;
  if (route === 'motion') wireMotion(main);
  if (route === 'prototype') wireProto(main);
  else clearTimeout(protoTimer);
  document.querySelectorAll('[data-platform]').forEach((b) => { if (b.tagName === 'BUTTON') b.addEventListener('click', () => { PG.platform = b.dataset.platform; save(); render(); }); });
  document.querySelectorAll('[data-scheme]').forEach((b) => { if (b.tagName === 'BUTTON') b.addEventListener('click', () => { PG.scheme = b.dataset.scheme; save(); render(); }); });
}

document.body.insertAdjacentHTML('afterbegin', WISP_DEFS);
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
let rT = 0; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!location.hash.includes('motion') && !location.hash.includes('prototype')) render(); }, 200); });
render();

</script>
